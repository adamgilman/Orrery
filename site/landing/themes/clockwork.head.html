<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500&family=Titillium+Web:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Clockwork. A machined mechanism in cold steel: rings on a gimbal, a gear train at true ratios, one ember of heat
   at the centre. Future, not antique. The diagrams are readouts on lit glass. The page commits to one look. */
:root{
  --graphite:#0B0D10; --steel:#151A20; --steel-2:#1C232B; --bevel:#2E3740; --bevel-light:#3D4854;
  --text:#E8ECEF; --text-dim:#98A2AD; --text-faint:#66717C;
  --ember:#FF7A1A; --ember-dim:rgba(255,122,26,.35);
  --glass:#F7F8FA; --glass-edge:#B9C2CC;
  --flow:#2563EB;
  --display:"Saira",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Titillium Web",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --measure:64ch;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--graphite);color:var(--text);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--text);text-decoration:none}a:hover{text-decoration:underline;text-decoration-color:var(--ember);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:300;text-wrap:balance;margin:0;color:var(--text);letter-spacing:-.005em}
h2{font-size:clamp(2rem,4.2vw,3.25rem);line-height:1.06}
h3{font-size:1.3rem;line-height:1.25;font-weight:400}
p{margin:0}
strong,b{font-weight:600}
.o-wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
/* A readout label: a short ember rule, then the name. */
.o-eyebrow{font:400 .95rem/1 var(--display);color:var(--ember);display:flex;align-items:center;gap:12px;letter-spacing:.02em}
.o-eyebrow::before{content:"";width:28px;height:2px;background:var(--ember);flex:none}
.o-lede{font-size:1.25rem;line-height:1.55;max-width:var(--measure);font-weight:300}
.o-body{max-width:var(--measure)}
.o-body + .o-body{margin-top:1em}
.o-muted{color:var(--text-dim)}
code{font-family:var(--mono);font-size:.875rem;color:var(--text)}
pre{margin:0;padding:20px 22px;background:var(--steel);color:var(--text-dim);border-top:1px solid var(--bevel-light);border-bottom:1px solid #05060A;border-radius:2px;overflow-x:auto;max-width:100%;font:400 .8125rem/1.6 var(--mono)}
pre code{color:inherit;font-size:inherit}
.o-pair>*,.o-split>*{min-width:0}
pre .k{color:var(--text-dim)} pre .s{color:#FFD9B8} pre .n{color:#9DB8FF} pre .c{color:var(--text-faint);font-style:italic}
pre .ins{color:#A9E2B4} pre .del{color:#F0A7A7}

/* ---------- header ---------- */
.o-head{position:relative;z-index:2}
.o-head .o-wrap{display:flex;align-items:center;justify-content:space-between;padding-top:24px;padding-bottom:10px}
.o-mark{font-family:var(--display);font-weight:500;font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text)}
.o-mark small{font-family:var(--sans);font-weight:400;font-size:.8rem;letter-spacing:.02em;text-transform:none;color:var(--text-faint);margin-left:14px}
.o-nav{display:flex;gap:26px;font-size:.92rem;font-weight:400}.o-nav a{color:var(--text-dim)}.o-nav a:hover{color:var(--text);text-decoration:none}

/* ---------- hero: the mechanism, pinned behind the page ---------- */
.o-hero{position:relative;background:radial-gradient(ellipse 70% 60% at 50% 12%,var(--steel-2) 0%,var(--steel) 40%,var(--graphite) 100%)}
.o-hero .o-wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;text-align:left;padding-top:clamp(8px,2vw,24px);padding-bottom:clamp(56px,7vw,104px)}
.o-hero .o-wrap>div:first-child{max-width:760px;position:relative;z-index:1;padding-top:clamp(240px,34vw,420px)}
.o-hero h1{font-size:clamp(3rem,7.4vw,6.25rem);line-height:.98;letter-spacing:-.02em;font-weight:300}
.o-hero h1 em{font-style:normal;font-weight:300}
.o-hero .o-lede{color:var(--text-dim);margin-top:28px}
.o-hero .o-lede strong{color:var(--text)}
.o-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px;align-items:center}
.o-btn{display:inline-block;padding:13px 22px;border-radius:2px;font:500 .95rem/1 var(--display);letter-spacing:.03em;background:var(--ember);color:#150A02;border:1px solid var(--ember)}
.o-btn:hover{background:#FF8C3A;border-color:#FF8C3A;text-decoration:none}
.o-btn.o-ghost{background:transparent;color:var(--text);border-color:var(--bevel-light)}
.o-btn.o-ghost:hover{border-color:var(--text)}
/* The mechanism is pinned to the right, behind the words, and fades as the reader scrolls. */
.o-plate{position:fixed;left:0;right:0;top:0;height:clamp(320px,46vw,560px);pointer-events:none;z-index:0;opacity:var(--dome-fade,1)}
.o-orrery{position:absolute;pointer-events:none}
.o-orrery-hero{width:clamp(560px,64vw,860px);height:auto;left:58%;top:52%;transform:translate(-50%,-50%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 55%,transparent 82%);mask-image:radial-gradient(circle at 50% 50%,#000 55%,transparent 82%)}
.o-engrave line{stroke:var(--text);stroke-opacity:.16}
.m-bezel{fill:none;stroke:var(--bevel-light);stroke-width:.8}
.m-ring{fill:none;stroke:var(--text);stroke-opacity:.34;stroke-width:1.1}
.m-run{fill:none;stroke:var(--ember);stroke-width:2.2;stroke-linecap:round;animation:m-run linear infinite}
@keyframes m-run{to{stroke-dashoffset:-2000}}
.m-gear{fill:var(--steel-2);stroke:var(--bevel-light);stroke-width:.9}
.m-gear path{fill:var(--steel-2);stroke:var(--text);stroke-opacity:.45;stroke-width:.8}
.m-hub{fill:var(--graphite);stroke:var(--ember);stroke-width:1.2}
.m-spoke{fill:none;stroke:var(--text);stroke-opacity:.2;stroke-width:.6;stroke-dasharray:3 6}
.m-lamp{fill:var(--ember)} .m-lamp-halo{fill:none;stroke:var(--ember);stroke-opacity:.35;stroke-width:1}
.o-turn{animation:o-turn linear infinite;transform-box:view-box}
.o-bodies .o-turn{transform-origin:50% 50%}
@keyframes o-turn{to{transform:rotate(360deg)}}
.o-dial,.o-dial-caption{display:none}
.o-first{position:relative;z-index:1;margin-top:clamp(40px,5vw,72px);display:grid;justify-items:start}
.o-first .o-screen{width:min(100%,380px)}
.o-first figcaption{max-width:52ch}

/* ---------- readouts ---------- */
.o-section{padding:clamp(64px,8vw,120px) 0;position:relative;z-index:1}
.o-close,.o-head{position:relative;z-index:1}
/* a machined seam between sections: a dark cut with a lit edge */
.o-section + .o-section{border-top:1px solid #05060A;box-shadow:inset 0 1px 0 var(--bevel)}
.o-section-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,64px);align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.o-section-head .o-eyebrow{margin-bottom:16px}
.o-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.o-three h3{margin-bottom:10px}
.o-three p{color:var(--text-dim)}
.o-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,40px);align-items:start}
/* A readout: lit glass in a thin steel bezel. */
.o-figure{margin:0;background:transparent}
.o-figure>svg,.o-screen{display:block;background:var(--glass);border-radius:2px;padding:18px;border:1px solid var(--glass-edge);box-shadow:0 0 0 1px var(--bevel),0 0 60px -24px rgba(232,236,239,.25)}
.o-figure svg{display:block;width:100%;height:auto}
.o-figure figcaption{margin-top:16px;font-size:.95rem;color:var(--text-dim);line-height:1.55;max-width:var(--measure)}
.o-figure figcaption b{color:var(--text);font-weight:600}
.o-wide{margin-top:clamp(24px,3vw,40px)}
.o-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start;margin-top:clamp(24px,3vw,40px)}
.o-list{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.o-list li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding-top:18px;border-top:1px solid var(--bevel)}
.o-list li:first-child{border-top:0;padding-top:0}
.o-list .o-term{font-family:var(--display);font-weight:400;font-size:1.1rem;line-height:1.3;color:var(--text)}
.o-list p{color:var(--text-dim)}

/* ---------- close ---------- */
.o-close{overflow:hidden;background:radial-gradient(ellipse 70% 90% at 85% 50%,var(--steel-2) 0%,var(--steel) 40%,var(--graphite) 100%)}
.o-close .o-wrap{position:relative;padding-top:clamp(72px,9vw,140px);padding-bottom:clamp(48px,6vw,96px)}
.o-orrery-close{width:min(100vw,900px);height:auto;right:-12%;top:50%;transform:translateY(-50%);opacity:.8}
.o-close .o-wrap>*{position:relative}
.o-close h2{font-size:clamp(2.5rem,5.5vw,4.5rem);max-width:16ch;letter-spacing:-.02em}
.o-close h2 em{font-style:normal;font-weight:300}
.o-close .o-lede{color:var(--text-dim);margin-top:22px}
.o-foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:clamp(48px,6vw,96px);padding-top:24px;border-top:1px solid var(--bevel);font-size:.9rem;color:var(--text-faint)}
.o-foot a{color:var(--text-dim)}.o-foot a:hover{color:var(--text)}

@media (max-width:900px){
  .o-section-head,.o-pair,.o-split,.o-three{grid-template-columns:minmax(0,1fr)}
  .o-section-head>*,.o-pair>*,.o-split>*,.o-three>*{min-width:0;max-width:100%}
  .o-plate{height:70vw}
  .o-hero .o-wrap>div:first-child{padding-top:56vw}
  .o-orrery-hero{width:130vw;left:50%}
  .o-orrery-close{right:-60%;width:160vw;opacity:.5}
  .o-figure>svg,.o-screen{padding:12px}
  .o-list li{grid-template-columns:1fr;gap:6px}
  .o-nav{display:none}
  .o-mark small{display:none}
}
@media (prefers-reduced-motion: reduce){ .o-turn,.m-run{animation:none} .flow{animation:none !important} }
</style>
