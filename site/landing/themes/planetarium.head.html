<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Planetarium. A dark dome, projected light, one gold hairline for the ecliptic. The diagrams are the exhibits,
   shown on white projection screens. The page commits to one look and paints every colour itself. */
:root{
  --void:#06070B; --dome:#0F1220; --dome-2:#151A2E;
  --light:#F2F4FF; --light-dim:#AEB4C8; --light-faint:#6E7590;
  --gold:#E8C46A;
  --screen:#FBFBFD; --screen-ink:#1B2030; --screen-muted:#5C6478;
  --flow:#2563EB;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --measure:62ch;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--void);color:var(--light);font:300 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--light);text-decoration:none}a:hover{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--sans);font-weight:300;text-wrap:balance;margin:0;color:var(--light)}
h2{font-size:clamp(2rem,4.2vw,3.25rem);line-height:1.08;letter-spacing:-.01em}
h3{font-size:1.35rem;line-height:1.25;font-weight:400}
p{margin:0}
strong,b{font-weight:500}
.o-wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
/* An exhibit label: a short gold rule, then the name in sentence case. */
.o-eyebrow{font:400 .9rem/1 var(--sans);color:var(--gold);display:flex;align-items:center;gap:12px}
.o-eyebrow::before{content:"";width:28px;height:1px;background:var(--gold);flex:none}
.o-lede{font-size:1.3rem;line-height:1.5;max-width:var(--measure);font-weight:300}
.o-body{max-width:var(--measure)}
.o-body + .o-body{margin-top:1em}
.o-muted{color:var(--light-dim)}
code{font-family:var(--mono);font-size:.875rem;color:var(--light)}
pre{margin:0;padding:20px 22px;background:var(--dome);color:var(--light-dim);border:1px solid rgba(242,244,255,.08);border-radius:4px;overflow-x:auto;max-width:100%;line-height:1.6;font:400 .8125rem/1.6 var(--mono)}
pre code{color:inherit;font-size:inherit}
.o-pair>*,.o-split>*{min-width:0}
pre .k{color:var(--light-dim)} pre .s{color:#F1DFA8} pre .n{color:#9DB8FF} pre .c{color:var(--light-faint);font-style:italic}
pre .ins{color:#A9E2B4} pre .del{color:#F0A7A7}

/* ---------- header ---------- */
.o-head{position:relative;z-index:2}
.o-head .o-wrap{display:flex;align-items:center;justify-content:space-between;padding-top:26px;padding-bottom:10px}
.o-mark{font-weight:400;font-size:1.2rem;letter-spacing:.18em;text-transform:uppercase;color:var(--light)}
.o-mark small{font-weight:300;font-size:.8rem;letter-spacing:.02em;text-transform:none;color:var(--light-faint);margin-left:14px}
.o-nav{display:flex;gap:26px;font-size:.92rem;font-weight:400}.o-nav a{color:var(--light-dim)}.o-nav a:hover{color:var(--light);text-decoration:none}

/* ---------- hero: the dome ---------- */
.o-hero{position:relative;background:radial-gradient(ellipse 90% 70% at 50% 0%,var(--dome-2) 0%,var(--dome) 45%,var(--void) 100%)}
.o-hero .o-wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding-top:clamp(8px,2vw,24px);padding-bottom:clamp(56px,7vw,104px)}
.o-hero .o-wrap>div:first-child{max-width:820px;position:relative;z-index:1}
.o-hero .o-eyebrow{justify-content:center}
.o-hero .o-eyebrow::before{display:none}
.o-hero h1{font-size:clamp(3rem,7.5vw,6.5rem);line-height:1;letter-spacing:-.025em;font-weight:300}
.o-hero h1 em{font-style:normal;font-weight:300;color:var(--light)}
.o-hero .o-lede{color:var(--light-dim);margin:28px auto 0}
.o-hero .o-lede strong{color:var(--light)}
.o-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px;align-items:center;justify-content:center}
.o-btn{display:inline-block;padding:13px 22px;border-radius:999px;font:400 .95rem/1 var(--sans);letter-spacing:.01em;background:var(--light);color:var(--void);border:1px solid var(--light)}
.o-btn:hover{background:#fff;text-decoration:none}
.o-btn.o-ghost{background:transparent;color:var(--light);border-color:rgba(242,244,255,.3)}
.o-btn.o-ghost:hover{border-color:var(--light)}
/* The projected orrery sits above the words, cropped by the top of the dome. */
/* The orrery is pinned behind the page and fades as the reader scrolls, becoming the dome the exhibits hang in. */
.o-plate{position:fixed;left:0;right:0;top:0;height:clamp(300px,42vw,520px);display:grid;justify-items:center;pointer-events:none;z-index:0;opacity:var(--dome-fade,1)}
.o-hero .o-wrap>div:first-child{padding-top:clamp(260px,36vw,440px)}
.o-orrery{position:absolute;pointer-events:none}
.o-orrery-hero{width:clamp(640px,90vw,1100px);height:auto;left:50%;top:50%;transform:translate(-50%,-50%);-webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 96%);mask-image:linear-gradient(to bottom,#000 58%,transparent 96%)}
.o-engrave line{stroke:var(--light);stroke-opacity:.18}
.o-ring{fill:none;stroke:var(--gold);stroke-opacity:.55;stroke-width:.6}
.o-orbit{fill:none;stroke:var(--light);stroke-opacity:.22;stroke-width:.7}
.o-sun{fill:var(--light)} .o-sun-halo{fill:none;stroke:var(--light);stroke-opacity:.25;stroke-width:.8}
.o-turn{animation:o-turn linear infinite;transform-box:view-box}
.o-bodies .o-turn{transform-origin:50% 50%}
@keyframes o-turn{to{transform:rotate(360deg)}}
.o-dial{display:none}
.o-dial-caption{display:none}
/* the first exhibit: the solar system, projected below the words */
.o-first{position:relative;z-index:1;margin-top:clamp(40px,5vw,72px);display:grid;justify-items:center}
.o-first .o-screen{width:min(100%,380px)}
.o-first figcaption{max-width:52ch;text-align:center}

/* ---------- exhibits ---------- */
.o-section{padding:clamp(64px,8vw,120px) 0;position:relative;z-index:1}
.o-close,.o-head{position:relative;z-index:1}
.o-section + .o-section::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 40px));height:1px;background:linear-gradient(90deg,transparent,rgba(232,196,106,.55) 20%,rgba(232,196,106,.55) 80%,transparent)}
.o-section-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,64px);align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.o-section-head .o-eyebrow{margin-bottom:16px}
.o-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.o-three h3{margin-bottom:10px}
.o-three p{color:var(--light-dim)}
.o-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,40px);align-items:start}
/* A projection screen: white, edge lit, no border. The diagram is the exhibit. */
.o-figure{margin:0;background:transparent}
.o-figure>svg,.o-screen{display:block;background:var(--screen);border-radius:4px;padding:18px;box-shadow:0 0 0 1px rgba(242,244,255,.06),0 0 90px -20px rgba(242,244,255,.18)}
.o-figure svg{display:block;width:100%;height:auto}
.o-figure figcaption{margin-top:16px;font-size:.95rem;color:var(--light-dim);line-height:1.55;max-width:var(--measure)}
.o-figure figcaption b{color:var(--light);font-weight:400}
.o-wide{margin-top:clamp(24px,3vw,40px)}
.o-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start;margin-top:clamp(24px,3vw,40px)}
.o-list{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.o-list li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding-top:18px;border-top:1px solid rgba(242,244,255,.1)}
.o-list li:first-child{border-top:0;padding-top:0}
.o-list .o-term{font-weight:400;font-size:1.15rem;line-height:1.3;color:var(--light)}
.o-list p{color:var(--light-dim)}

/* ---------- close ---------- */
.o-close{position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 90% at 85% 50%,var(--dome-2) 0%,var(--dome) 40%,var(--void) 100%)}
.o-close .o-wrap{position:relative;padding-top:clamp(72px,9vw,140px);padding-bottom:clamp(48px,6vw,96px)}
.o-orrery-close{width:min(110vw,1000px);height:auto;right:-14%;top:50%;transform:translateY(-50%);opacity:.7}
.o-close .o-wrap>*{position:relative}
.o-close h2{font-size:clamp(2.5rem,5.5vw,4.5rem);max-width:16ch;letter-spacing:-.02em}
.o-close h2 em{font-style:normal;font-weight:300}
.o-close .o-lede{color:var(--light-dim);margin-top:22px}
.o-close .o-cta{justify-content:flex-start}
.o-foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:clamp(48px,6vw,96px);padding-top:24px;border-top:1px solid rgba(242,244,255,.12);font-size:.9rem;color:var(--light-faint)}
.o-foot a{color:var(--light-dim)}.o-foot a:hover{color:var(--light)}

@media (max-width:900px){
  .o-section-head,.o-pair,.o-split,.o-three{grid-template-columns:minmax(0,1fr)}
  .o-section-head>*,.o-pair>*,.o-split>*,.o-three>*{min-width:0;max-width:100%}
  .o-plate{height:62vw}
  .o-hero .o-wrap>div:first-child{padding-top:50vw}
  .o-orrery-hero{width:150vw;transform:translate(-50%,-50%)}
  .o-orrery-close{right:-60%;width:160vw;opacity:.45}
  .o-figure>svg,.o-screen{padding:12px}
  .o-list li{grid-template-columns:1fr;gap:6px}
  .o-nav{display:none}
  .o-mark small{display:none}
}
@media (prefers-reduced-motion: reduce){ .o-turn{animation:none} .flow{animation:none !important} }
</style>
