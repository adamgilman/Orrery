@keyframes orrery-state-1{0%{opacity:0}50%{opacity:0}59.38%{opacity:1}100%{opacity:1}}
[data-lod="detail"][data-for~="sessions"]{animation:orrery-lod-sessions-detail 16s linear infinite}
[data-lod="summary"][data-for~="sessions"]{animation:orrery-lod-sessions-summary 16s linear infinite}
@keyframes orrery-lod-sessions-detail{0%{opacity:0}32.5%{opacity:0}34.38%{opacity:1}82.5%{opacity:1}84.38%{opacity:0}100%{opacity:0}}
@keyframes orrery-lod-sessions-summary{0%{opacity:1}32.5%{opacity:1}34.38%{opacity:0}82.5%{opacity:0}84.38%{opacity:1}100%{opacity:1}}
@keyframes orrery-caption-0{0%{opacity:1}25%{opacity:1}26.88%{opacity:0}100%{opacity:0}}
@keyframes orrery-caption-1{0%{opacity:0}32.5%{opacity:0}34.38%{opacity:1}50%{opacity:1}51.88%{opacity:0}100%{opacity:0}}
@keyframes orrery-caption-2{0%{opacity:0}57.5%{opacity:0}59.38%{opacity:1}75%{opacity:1}76.88%{opacity:0}100%{opacity:0}}
@keyframes orrery-caption-3{0%{opacity:0}82.5%{opacity:0}84.38%{opacity:1}100%{opacity:1}}</style>
