<path class="flow" data-flow="db->replica" data-load="0.2" d="M289.5 285.5 L289.5 323.5" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-sync" data-edge="api->sessions" data-kind="sync" d="M213.5 68 L213.5 169 L109.5 169 L109.5 237.5" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->sessions" data-load="0.5" d="M213.5 68 L213.5 169 L109.5 169 L109.5 225.5" style="stroke-width:3;animation-duration:1.8s"/>
</g>
