<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417 558" width="417" height="558" data-orrery="1">
<title>Node kinds</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-region .group-box{stroke-dasharray:8 6}
.group-zone .group-box{stroke-dasharray:3 5}
.group-cluster .group-box{stroke:#94a3b8}
.group-boundary .group-box{stroke:#dc2626;stroke-dasharray:6 6;fill:none}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.node-state-failed .node-box{fill:#fef2f2;stroke:#dc2626;stroke-width:2;animation:orrery-pulse 1.2s linear infinite}
.node-state-failed .node-label{fill:#991b1b}
.node-state-degraded .node-box{fill:#fffbeb;stroke:#d97706;stroke-width:2}
.node-state-degraded .node-label{fill:#92400e}
.node-state-off{opacity:.45}
.node-state-off .node-box{stroke-dasharray:4 4}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker></defs>
<g class="groups">

</g>
<g class="edges">
<path class="edge edge-sync" data-edge="app->gw" data-kind="sync" d="M305 68 L305 108" marker-end="url(#arrow)"/>
<path class="flow" data-flow="app->gw" data-load="0.8" d="M305 68 L305 96" style="stroke-width:3.9;animation-duration:1s"/>
<path class="edge edge-sync" data-edge="gw->orders" data-kind="sync" d="M305 156 L305 196" marker-end="url(#arrow)"/>
<path class="flow" data-flow="gw->orders" data-load="0.7" d="M305 156 L305 184" style="stroke-width:3.6;animation-duration:1.3s"/>
<path class="edge edge-sync" data-edge="orders->db" data-kind="sync" d="M285 244 L285 269 L60 269 L60 304" marker-end="url(#arrow)"/>
<path class="flow" data-flow="orders->db" data-load="0.5" d="M285 244 L285 269 L60 269 L60 292" style="stroke-width:3;animation-duration:1.8s"/>
<path class="edge edge-sync" data-edge="orders->cache" data-kind="sync" d="M305 244 L305 279 L187 279 L187 304" marker-end="url(#arrow)"/>
<path class="flow" data-flow="orders->cache" data-load="0.6" d="M305 244 L305 279 L187 279 L187 292" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-async" data-edge="orders->events" data-kind="async" d="M325 244 L325 304" marker-end="url(#arrow)"/>
<path class="flow" data-flow="orders->events" data-load="0.3" d="M325 244 L325 292" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-async" data-edge="events->notify" data-kind="async" d="M308 352 L308 377 L196 377 L196 402" marker-end="url(#arrow)"/>
<path class="flow" data-flow="events->notify" data-load="0.3" d="M308 352 L308 377 L196 377 L196 390" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-dataflow" data-edge="events->archive" data-kind="dataflow" d="M342 352 L342 402" marker-end="url(#arrow)"/>
<path class="flow" data-flow="events->archive" data-load="0.2" d="M342 352 L342 390" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-sync" data-edge="notify->sms" data-kind="sync" d="M196 450 L196 490" marker-end="url(#arrow)"/>
<path class="flow" data-flow="notify->sms" data-load="0.2" d="M196 450 L196 478" style="stroke-width:2.1;animation-duration:2.5s"/>
</g>
<g class="nodes">
<g class="node node-client" data-node="app" data-kind="client" data-state="on" transform="translate(239 20)">
<rect class="node-box" width="132" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><rect x="1.5" y="2.5" width="13" height="9" rx="1"/><path d="M5 14.5h6M8 11.5v3"/></g>
<text class="node-label" x="84" y="24">Mobile app</text>
</g>
<g class="node node-gateway" data-node="gw" data-kind="gateway" data-state="on" transform="translate(235 108)">
<rect class="node-box" width="140" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z"/></g>
<text class="node-label" x="88" y="24">API gateway</text>
</g>
<g class="node node-service" data-node="orders" data-kind="service" data-state="on" transform="translate(265 196)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">Orders</text>
</g>
<g class="node node-database" data-node="db" data-kind="database" data-state="on" transform="translate(20 304)">
<rect class="node-box" width="80" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="58" y="24">DB</text>
</g>
<g class="node node-cache" data-node="cache" data-kind="cache" data-state="on" transform="translate(140 304)">
<rect class="node-box" width="94" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M9 1.5L3 9h4.5l-1 5.5L13 7H8.5z"/></g>
<text class="node-label" x="65" y="24">Cache</text>
</g>
<g class="node node-queue" data-node="events" data-kind="queue" data-state="on" transform="translate(274 304)">
<rect class="node-box" width="102" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><rect x="1.5" y="5" width="3.5" height="6" rx=".5"/><rect x="6.25" y="5" width="3.5" height="6" rx=".5"/><rect x="11" y="5" width="3.5" height="6" rx=".5"/></g>
<text class="node-label" x="69" y="24">Events</text>
</g>
<g class="node node-function" data-node="notify" data-kind="function" data-state="on" transform="translate(145 402)">
<rect class="node-box" width="102" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><text class="glyph-text" x="8" y="8.5">λ</text></g>
<text class="node-label" x="69" y="24">Notify</text>
</g>
<g class="node node-storage" data-node="archive" data-kind="storage" data-state="on" transform="translate(287 402)">
<rect class="node-box" width="110" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M2 3.5h12l-1.5 10.5h-9z"/><path d="M2 3.5c0 1.2 2.7 2 6 2s6-.8 6-2"/></g>
<text class="node-label" x="73" y="24">Archive</text>
</g>
<g class="node node-external" data-node="sms" data-kind="external" data-state="on" transform="translate(134 490)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">SMS provider</text>
</g>
</g>
</svg>
