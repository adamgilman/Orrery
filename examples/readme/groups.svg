<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 409 448" width="409" height="448" data-orrery="1">
<title>Nested groups</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-region .group-box{stroke-dasharray:8 6}
.group-zone .group-box{stroke-dasharray:3 5}
.group-cluster .group-box{stroke:#94a3b8}
.group-boundary .group-box{stroke:#dc2626;stroke-dasharray:6 6;fill:none}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.node-state-failed .node-box{fill:#fef2f2;stroke:#dc2626;stroke-width:2;animation:orrery-pulse 1.2s linear infinite}
.node-state-failed .node-label{fill:#991b1b}
.node-state-degraded .node-box{fill:#fffbeb;stroke:#d97706;stroke-width:2}
.node-state-degraded .node-label{fill:#92400e}
.node-state-off{opacity:.45}
.node-state-off .node-box{stroke-dasharray:4 4}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker></defs>
<g class="groups">
<g class="group group-region" data-group="region">
<rect class="group-box" x="20" y="115.5" width="369" height="312.5" rx="10"/>
<text class="group-label" x="32" y="131.5">eu-west-1</text>
</g>
<g class="group group-tier" data-group="web">
<rect class="group-box" x="67.8" y="159" width="104" height="96" rx="10"/>
<text class="group-label" x="79.8" y="175">Web tier</text>
</g>
<g class="group group-tier" data-group="data">
<rect class="group-box" x="32" y="320" width="149" height="96" rx="10"/>
<text class="group-label" x="44" y="336">Data tier</text>
</g>
<g class="group group-boundary" data-group="pci">
<rect class="group-box" x="221" y="320" width="156" height="96" rx="10"/>
<text class="group-label" x="233" y="336">PCI boundary</text>
</g>
</g>
<g class="edges">
<path class="edge edge-sync" data-edge="cdn->app" data-kind="sync" d="M119.8 68 L119.8 195" marker-end="url(#arrow)"/>
<path class="flow" data-flow="cdn->app" data-load="0.8" d="M119.8 68 L119.8 183" style="stroke-width:3.9;animation-duration:1s"/>
<path class="edge edge-sync" data-edge="app->db" data-kind="sync" d="M106.5 243 L106.5 356" marker-end="url(#arrow)"/>
<path class="flow" data-flow="app->db" data-load="0.5" d="M106.5 243 L106.5 344" style="stroke-width:3;animation-duration:1.8s"/>
<path class="edge edge-sync" data-edge="app->vault" data-kind="sync" d="M133.2 243 L133.2 287.5 L299 287.5 L299 356" marker-end="url(#arrow)"/>
<path class="flow" data-flow="app->vault" data-load="0.2" d="M133.2 243 L133.2 287.5 L299 287.5 L299 344" style="stroke-width:2.1;animation-duration:2.5s"/>
</g>
<g class="nodes">
<g class="node node-gateway" data-node="cdn" data-kind="gateway" data-state="on" transform="translate(79.8 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z"/></g>
<text class="node-label" x="58" y="24">CDN</text>
</g>
<g class="node node-service" data-node="app" data-kind="service" data-state="on" transform="translate(79.8 195)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">App</text>
</g>
<g class="node node-database" data-node="db" data-kind="database" data-state="on" transform="translate(44 356)">
<rect class="node-box" width="125" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="80.5" y="24">Orders DB</text>
</g>
<g class="node node-storage" data-node="vault" data-kind="storage" data-state="on" transform="translate(233 356)">
<rect class="node-box" width="132" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M2 3.5h12l-1.5 10.5h-9z"/><path d="M2 3.5c0 1.2 2.7 2 6 2s6-.8 6-2"/></g>
<text class="node-label" x="84" y="24">Card vault</text>
</g>
</g>
</svg>
