<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 780" width="324" height="780" data-orrery="1">
<title>Inside Payments</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:4px;stroke-linejoin:round}
[data-lod="detail"]{opacity:0}
.group[data-collapsed] .group-box{fill-opacity:.7}
.summary-label{font:500 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.summary-count{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.node-tech{font:11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central}
.replicas rect{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
.badge{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:end;dominant-baseline:central}
.node[data-ghost]{opacity:.5}.node[data-ghost] .node-box{stroke-dasharray:3 3}.node[data-ghost] .node-label{font-style:italic}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge.need{stroke:#475569;stroke-width:2}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.legend text{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;dominant-baseline:central}.legend .legend-name{font-weight:600;fill:#0f172a}
.step-note{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;dominant-baseline:central}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}
.kind-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.gk-region .group-box{stroke-dasharray:8 6}
.gk-zone .group-box{stroke-dasharray:3 5}
.gk-cluster .group-box{stroke:#94a3b8}
.gk-boundary .group-box{stroke:#dc2626;fill-opacity:0;stroke-dasharray:8 6}
.st-degraded .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .node-label{fill:#92400e}
.st-degraded .group-label{fill:#92400e}
.st-failed .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .node-label{fill:#991b1b}
.st-failed .group-label{fill:#991b1b}
.st-off .node-box{stroke-dasharray:4 4}
.st-off .group-box{stroke-dasharray:4 4}
.st-off{opacity:0.45}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker><marker id="arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12z" fill="#94a3b8"/></marker></defs>
<g class="scene">
<g class="view" data-view="payments" data-title="Inside Payments" data-size="324 780">
<g class="groups">
<g class="group gk-boundary st-on" data-group="payments" data-bbox="20 171.5 269 483" data-state="on">
<rect class="group-box" x="20" y="171.5" width="269" height="483" rx="10"/>
<text class="group-label" x="32" y="187.5">Payments</text>
</g>
<g class="group gk-tier st-on" data-group="pay-core" data-bbox="32 215 245 322" data-state="on">
<rect class="group-box" x="32" y="215" width="245" height="322" rx="10"/>
<text class="group-label" x="44" y="231">Core</text>
</g>
</g>
<g class="edges">
<path class="edge edge-sync need" data-edge="checkout->pay-api" data-kind="sync" d="M139.7 68 L139.7 251" marker-end="url(#arrow)"/>
<path class="flow" data-flow="checkout->pay-api" data-load="0.5" d="M139.7 68 L139.7 239" style="stroke-width:3;animation-duration:1.8s"/>
<text class="edge-label" x="113.7" y="116">charge</text>
<path class="edge edge-sync need" data-edge="pay-api->ledger" data-kind="sync" d="M98.3 299 L98.3 379" marker-end="url(#arrow)"/>
<path class="flow" data-flow="pay-api->ledger" data-load="0.5" d="M98.3 299 L98.3 367" style="stroke-width:3;animation-duration:1.8s"/>
<path class="edge edge-sync need" data-edge="pay-api->ledger-replica" data-kind="sync" d="M119 299 L119 354 L174.3 354 L174.3 452 L152.7 452 L152.7 477" marker-end="url(#arrow)"/>
<path class="flow" data-flow="pay-api->ledger-replica" data-load="0" d="M119 299 L119 354 L174.3 354 L174.3 452 L152.7 452 L152.7 465" style="stroke-width:1.5;animation:none;opacity:0"/>
<path class="edge edge-replication" data-edge="ledger->ledger-replica" data-kind="replication" d="M98.3 427 L98.3 477" marker-end="url(#arrow)"/>
<path class="flow" data-flow="ledger->ledger-replica" data-load="0.2" d="M98.3 427 L98.3 465" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-sync need" data-edge="pay-api->tokens" data-kind="sync" d="M139.7 299 L139.7 344 L232 344 L232 569.5 L157 569.5 L157 594.5" marker-end="url(#arrow)"/>
<path class="flow" data-flow="pay-api->tokens" data-load="0.3" d="M139.7 299 L139.7 344 L232 344 L232 569.5 L157 569.5 L157 582.5" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-sync need" data-edge="pay-api->stripe" data-kind="sync" d="M160.3 299 L160.3 334 L248 334 L248 687 L144 687 L144 712" marker-end="url(#arrow)"/>
<path class="flow" data-flow="pay-api->stripe" data-load="0.3" d="M160.3 299 L160.3 334 L248 334 L248 687 L144 687 L144 700" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-sync need" data-edge="pay-api->adyen" data-kind="sync" d="M181 299 L181 324 L264 324 L264 712" marker-end="url(#arrow)"/>
<path class="flow" data-flow="pay-api->adyen" data-load="0" d="M181 299 L181 324 L264 324 L264 700" style="stroke-width:1.5;animation:none;opacity:0"/>
</g>
<g class="nodes">
<g class="node kind-service st-on" data-node="pay-api" data-kind="service" data-state="on" data-bbox="77.7 251 124 48" transform="translate(77.7 251)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">Payments API</text>
</g>
<g class="node kind-database st-on" data-node="ledger" data-kind="database" data-state="on" data-bbox="47.3 379 102 48" transform="translate(47.3 379)">
<rect class="node-box" width="102" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="69" y="24">Ledger</text>
</g>
<g class="node kind-database st-on" data-node="ledger-replica" data-kind="database" data-state="on" data-bbox="44 477 163 48" transform="translate(44 477)">
<rect class="node-box" width="163" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="99.5" y="24">Ledger replica</text>
</g>
<g class="node kind-storage st-on" data-node="tokens" data-kind="storage" data-state="on" data-bbox="91 594.5 132 48" transform="translate(91 594.5)">
<rect class="node-box" width="132" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M2 3.5h12l-1.5 10.5h-9z"/><path d="M2 3.5c0 1.2 2.7 2 6 2s6-.8 6-2"/></g>
<text class="node-label" x="84" y="24">Card vault</text>
</g>
<g class="node st-on" data-node="checkout" data-kind="service" data-state="on" data-ghost="1" data-bbox="93.2 20 93 48" transform="translate(93.2 20)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">Checkout</text>
</g>
<g class="node st-on" data-node="stripe" data-kind="external" data-state="on" data-ghost="1" data-bbox="104 712 80 48" transform="translate(104 712)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">Stripe</text>
</g>
<g class="node st-on" data-node="adyen" data-kind="external" data-state="on" data-ghost="1" data-bbox="224 712 80 48" transform="translate(224 712)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">Adyen</text>
</g>
</g>
</g>
</g>
</svg>
