[data-lod="summary"][data-for~="orders"]{animation:orrery-lod-orders-summary 12s linear infinite}
@keyframes orrery-lod-orders-detail{0%{opacity:0}35%{opacity:0}37.5%{opacity:1}85%{opacity:1}87.5%{opacity:0}100%{opacity:0}}
