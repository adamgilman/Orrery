<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754.5 224" width="754.5" height="224" data-orrery="1">
<title>Platform</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:4px;stroke-linejoin:round}
.group.collapsed .group-box{fill:#ffffff;fill-opacity:1;stroke-width:2}
.collapsed-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central;letter-spacing:0;text-transform:none;stroke:none}
.group-count{font:11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.node-tech{font:11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central}
.replicas rect{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
.badge{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:end;dominant-baseline:central}
.node[data-ghost]{opacity:.5}.node[data-ghost] .node-box{stroke-dasharray:3 3}.node[data-ghost] .node-label{font-style:italic}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge.need{stroke:#475569;stroke-width:2}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.legend text{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;dominant-baseline:central}.legend .legend-name{font-weight:600;fill:#0f172a}
.step-note{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;dominant-baseline:central}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}
.kind-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.gk-region .group-box{stroke-dasharray:8 6}
.gk-zone .group-box{stroke-dasharray:3 5}
.gk-cluster .group-box{stroke:#94a3b8}
.gk-boundary .group-box{stroke:#dc2626;fill-opacity:0;stroke-dasharray:8 6}
.st-degraded .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .node-label{fill:#92400e}
.st-degraded .group-label{fill:#92400e}
.st-failed .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .node-label{fill:#991b1b}
.st-failed .group-label{fill:#991b1b}
.st-off .node-box{stroke-dasharray:4 4}
.st-off .group-box{stroke-dasharray:4 4}
.st-off{opacity:0.45}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker><marker id="arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12z" fill="#94a3b8"/></marker></defs>
<g class="scene">
<g class="view" data-view="overview" data-title="Platform" data-size="754.5 224">
<g class="groups">
<g class="group gk-tier st-on" data-group="storefront" data-bbox="20 20 247 184" data-state="on">
<rect class="group-box" x="20" y="20" width="247" height="184" rx="10"/>
<text class="group-label" x="32" y="36">Storefront</text>
</g>
<g class="group gk-boundary st-on collapsed" data-group="payments" data-bbox="484.5 42 120 60" data-state="on" data-collapsed="4">
<rect class="group-box" x="484.5" y="42" width="120" height="60" rx="10"/>
<text class="group-label collapsed-label" x="544.5" y="65">Payments</text>
<text class="group-count" x="544.5" y="83">4 inside</text>
</g>
<g class="group gk-tier st-on collapsed" data-group="identity" data-bbox="324.5 113 120 60" data-state="on" data-collapsed="2">
<rect class="group-box" x="324.5" y="113" width="120" height="60" rx="10"/>
<text class="group-label collapsed-label" x="384.5" y="136">Identity</text>
<text class="group-count" x="384.5" y="154">2 inside</text>
</g>
</g>
<g class="edges">
<path class="edge edge-sync need" data-edge="web->checkout" data-kind="sync" d="M112 80 L162 80" marker-end="url(#arrow)"/>
<path class="flow" data-flow="web->checkout" data-load="0.8" d="M112 80 L150 80" style="stroke-width:3.9;animation-duration:1s"/>
<path class="edge edge-sync" data-edge="web->catalog" data-kind="sync" d="M112 96 L137 96 L137 168 L162 168" marker-end="url(#arrow)"/>
<path class="flow" data-flow="web->catalog" data-load="0.6" d="M112 96 L137 96 L137 168 L150 168" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync need" data-edge="checkout->payments" data-kind="sync" d="M255 72 L484.5 72" marker-end="url(#arrow)"/>
<path class="flow" data-flow="checkout->payments" data-load="0.5" d="M255 72 L472.5 72" style="stroke-width:3;animation-duration:1.8s"/>
<text class="edge-label" x="384.5" y="61">charge</text>
<path class="edge edge-sync need" data-edge="checkout->identity" data-kind="sync" d="M255 88 L299.5 88 L299.5 143 L324.5 143" marker-end="url(#arrow)"/>
<path class="flow" data-flow="checkout->identity" data-load="0.4" d="M255 88 L299.5 88 L299.5 143 L312.5 143" style="stroke-width:2.7;animation-duration:2s"/>
<path class="edge edge-sync need" data-edge="payments->stripe" data-kind="sync" d="M604.5 62 L654.5 62" marker-end="url(#arrow)"/>
<path class="flow" data-flow="payments->stripe" data-load="0.3" d="M604.5 62 L642.5 62" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-sync need" data-edge="payments->adyen" data-kind="sync" d="M604.5 82 L629.5 82 L629.5 150 L654.5 150" marker-end="url(#arrow)"/>
<path class="flow" data-flow="payments->adyen" data-load="0" d="M604.5 82 L629.5 82 L629.5 150 L642.5 150" style="stroke-width:1.5;animation:none;opacity:0"/>
</g>
<g class="nodes">
<g class="node kind-gateway st-on" data-node="web" data-kind="gateway" data-state="on" data-bbox="32 64 80 48" transform="translate(32 64)">
<rect class="node-box" width="80" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z"/></g>
<text class="node-label" x="58" y="24">Web</text>
</g>
<g class="node kind-service st-on" data-node="checkout" data-kind="service" data-state="on" data-bbox="162 56 93 48" transform="translate(162 56)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">Checkout</text>
</g>
<g class="node kind-service st-on" data-node="catalog" data-kind="service" data-state="on" data-bbox="162 144 86 48" transform="translate(162 144)">
<rect class="node-box" width="86" height="48" rx="8"/>
<text class="node-label" x="43" y="24">Catalog</text>
</g>
<g class="node kind-external st-on" data-node="stripe" data-kind="external" data-state="on" data-bbox="654.5 38 80 48" transform="translate(654.5 38)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">Stripe</text>
</g>
<g class="node kind-external st-on" data-node="adyen" data-kind="external" data-state="on" data-bbox="654.5 126 80 48" transform="translate(654.5 126)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">Adyen</text>
</g>
</g>
</g>
</g>
</svg>
