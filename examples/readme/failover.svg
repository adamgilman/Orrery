<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298.3 372" width="298.3" height="372" data-orrery="1">
<title>Failover</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-region .group-box{stroke-dasharray:8 6}
.group-zone .group-box{stroke-dasharray:3 5}
.group-cluster .group-box{stroke:#94a3b8}
.group-boundary .group-box{stroke:#dc2626;stroke-dasharray:6 6;fill:none}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:4px;stroke-linejoin:round}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.node-state-failed .node-box{fill:#fef2f2;stroke:#dc2626;stroke-width:2;animation:orrery-pulse 1.2s linear infinite}
.node-state-failed .node-label{fill:#991b1b}
.node-state-degraded .node-box{fill:#fffbeb;stroke:#d97706;stroke-width:2}
.node-state-degraded .node-label{fill:#92400e}
.node-state-off{opacity:.45}
.node-state-off .node-box{stroke-dasharray:4 4}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker></defs>
<g class="groups">

</g>
<g class="edges">
<path class="edge edge-sync" data-edge="web->api" data-kind="sync" d="M96.3 68 L96.3 108" marker-end="url(#arrow)"/>
<path class="flow" data-flow="web->api" data-load="0.8" d="M96.3 68 L96.3 96" style="stroke-width:3.9;animation-duration:1s"/>
<path class="edge edge-sync" data-edge="api->db" data-kind="sync" d="M109.7 156 L109.7 181 L190.7 181 L190.7 206" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->db" data-load="0.6" d="M109.7 156 L109.7 181 L190.7 181 L190.7 194" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync" data-edge="api->replica" data-kind="sync" d="M83 156 L83 304" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->replica" data-load="0" d="M83 156 L83 292" style="stroke-width:1.5;animation:none;opacity:0"/>
<text class="edge-label" x="50.5" y="230">failover</text>
<path class="edge edge-replication" data-edge="db->replica" data-kind="replication" d="M209 254 L209 279 L119.7 279 L119.7 304" marker-end="url(#arrow)"/>
<path class="flow" data-flow="db->replica" data-load="0.2" d="M209 254 L209 279 L119.7 279 L119.7 292" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-sync" data-edge="worker->db" data-kind="sync" d="M227.3 156 L227.3 206" marker-end="url(#arrow)"/>
<path class="flow" data-flow="worker->db" data-load="0.2" d="M227.3 156 L227.3 194" style="stroke-width:2.1;animation-duration:2.5s"/>
</g>
<g class="nodes">
<g class="node node-gateway" data-node="web" data-kind="gateway" data-state="on" transform="translate(56.3 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z"/></g>
<text class="node-label" x="58" y="24">Web</text>
</g>
<g class="node node-service" data-node="api" data-kind="service" data-state="on" transform="translate(56.3 108)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">API</text>
</g>
<g class="node node-database" data-node="db" data-kind="database" data-state="on" transform="translate(154 206)">
<rect class="node-box" width="110" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="73" y="24">Primary</text>
</g>
<g class="node node-database" data-node="replica" data-kind="database" data-state="on" transform="translate(46.3 304)">
<rect class="node-box" width="110" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="73" y="24">Replica</text>
</g>
<g class="node node-function" data-node="worker" data-kind="function" data-state="on" transform="translate(176.3 108)">
<rect class="node-box" width="102" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><text class="glyph-text" x="8" y="8.5">λ</text></g>
<text class="node-label" x="69" y="24">Worker</text>
</g>
</g>
</svg>
