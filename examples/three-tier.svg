<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1551 247" width="1551" height="247" data-orrery="1">
<title>Checkout: three-tier with read replica</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-region .group-box{stroke-dasharray:8 6}
.group-zone .group-box{stroke-dasharray:3 5}
.group-cluster .group-box{stroke:#94a3b8}
.group-boundary .group-box{stroke:#dc2626;stroke-dasharray:6 6;fill:none}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.node-state-failed .node-box{fill:#fef2f2;stroke:#dc2626;stroke-width:2;animation:orrery-pulse 1.2s linear infinite}
.node-state-failed .node-label{fill:#991b1b}
.node-state-degraded .node-box{fill:#fffbeb;stroke:#d97706;stroke-width:2}
.node-state-degraded .node-label{fill:#92400e}
.node-state-off{opacity:.45}
.node-state-off .node-box{stroke-dasharray:4 4}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker></defs>
<g class="groups">

</g>
<g class="edges">
<path class="edge edge-sync" data-edge="cdn->web" data-kind="sync" d="M100 188.6 L221 188.6" marker-end="url(#arrow)"/>
<path class="flow" data-flow="cdn->web" data-load="0.9" d="M100 188.6 L209 188.6" style="stroke-width:4.2;animation-duration:0.8s"/>
<text class="edge-label" x="160.5" y="199.6">HTTPS</text>
<path class="edge edge-sync" data-edge="web->api" data-kind="sync" d="M314 188.6 L429 188.6" marker-end="url(#arrow)"/>
<path class="flow" data-flow="web->api" data-load="0.7" d="M314 188.6 L417 188.6" style="stroke-width:3.6;animation-duration:1.3s"/>
<text class="edge-label" x="371.5" y="199.6">REST</text>
<path class="edge edge-sync" data-edge="api->cache" data-kind="sync" d="M553 174.2 L578 174.2 L578 44 L623 44" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->cache" data-load="0.6" d="M553 174.2 L578 174.2 L578 44 L611 44" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync" data-edge="api->db" data-kind="sync" d="M553 193.4 L598 193.4 L598 119 L981 119 L981 187 L1006 187" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->db" data-load="0.5" d="M553 193.4 L598 193.4 L598 119 L981 119 L981 187 L994 187" style="stroke-width:3;animation-duration:1.8s"/>
<text class="edge-label" x="688.5" y="130">writes</text>
<path class="edge edge-sync" data-edge="api->replica" data-kind="sync" d="M553 183.8 L588 183.8 L588 93 L1329 93 L1329 179 L1354 179" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->replica" data-load="0.3" d="M553 183.8 L588 183.8 L588 93 L1329 93 L1329 179 L1342 179" style="stroke-width:2.4;animation-duration:2.3s"/>
<text class="edge-label" x="875" y="82">reads</text>
<path class="edge edge-sync" data-edge="db->replica" data-kind="sync" d="M1183 195 L1354 195" marker-end="url(#arrow)"/>
<path class="flow" data-flow="db->replica" data-load="0.2" d="M1183 195 L1342 195" style="stroke-width:2.1;animation-duration:2.5s"/>
<text class="edge-label" x="1263.5" y="206">replication</text>
<path class="edge edge-sync" data-edge="api->queue" data-kind="sync" d="M553 203 L626.5 203" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->queue" data-load="0.4" d="M553 203 L614.5 203" style="stroke-width:2.7;animation-duration:2s"/>
<path class="edge edge-sync" data-edge="queue->worker" data-kind="sync" d="M750.5 203 L794 203" marker-end="url(#arrow)"/>
<path class="flow" data-flow="queue->worker" data-load="0.4" d="M750.5 203 L782 203" style="stroke-width:2.7;animation-duration:2s"/>
<path class="edge edge-sync" data-edge="worker->db" data-kind="sync" d="M956 203 L1006 203" marker-end="url(#arrow)"/>
<path class="flow" data-flow="worker->db" data-load="0.1" d="M956 203 L994 203" style="stroke-width:1.8;animation-duration:2.8s"/>
</g>
<g class="nodes">
<g class="node node-service" data-node="cdn" data-kind="service" data-state="on" transform="translate(20 164.6)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">CDN</text>
</g>
<g class="node node-service" data-node="web" data-kind="service" data-state="on" transform="translate(221 164.6)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">Web tier</text>
</g>
<g class="node node-service" data-node="api" data-kind="service" data-state="on" transform="translate(429 164.6)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">Checkout API</text>
</g>
<g class="node node-service" data-node="cache" data-kind="service" data-state="on" transform="translate(623 20)">
<rect class="node-box" width="131" height="48" rx="8"/>
<text class="node-label" x="65.5" y="24">Session cache</text>
</g>
<g class="node node-service" data-node="db" data-kind="service" data-state="on" transform="translate(1006 171)">
<rect class="node-box" width="177" height="48" rx="8"/>
<text class="node-label" x="88.5" y="24">Orders DB (primary)</text>
</g>
<g class="node node-service" data-node="replica" data-kind="service" data-state="on" transform="translate(1354 163)">
<rect class="node-box" width="177" height="48" rx="8"/>
<text class="node-label" x="88.5" y="24">Orders DB (replica)</text>
</g>
<g class="node node-service" data-node="queue" data-kind="service" data-state="on" transform="translate(626.5 179)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">Events queue</text>
</g>
<g class="node node-service" data-node="worker" data-kind="service" data-state="on" transform="translate(794 179)">
<rect class="node-box" width="162" height="48" rx="8"/>
<text class="node-label" x="81" y="24">Fulfilment worker</text>
</g>
</g>
</svg>
