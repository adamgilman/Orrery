<rect class="node-box" width="94" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M9 1.5L3 9h4.5l-1 5.5L13 7H8.5z"/></g>
<text class="node-label" x="65" y="24">Redis</text>
