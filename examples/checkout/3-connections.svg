<g class="glyph" transform="translate(12 16)"><path d="M9 1.5L3 9h4.5l-1 5.5L13 7H8.5z"/></g>
<text class="node-label" x="65" y="24">Redis</text>
</g>
<g class="node kind-storage st-on" data-node="aof-b" data-kind="storage" data-state="on" data-bbox="56 709.5 178 48" transform="translate(56 709.5)">
<rect class="node-box" width="178" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M2 3.5h12l-1.5 10.5h-9z"/><path d="M2 3.5c0 1.2 2.7 2 6 2s6-.8 6-2"/></g>
<text class="node-label" x="107" y="24">Append-only file</text>
</g>
</g>
</g>
</g>
</svg>
