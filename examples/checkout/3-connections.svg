<path class="flow" data-flow="api->sessions" data-load="0.5" d="M284.5 156 L284.5 257 L145 257 L145 313.5" style="stroke-width:3;animation-duration:1.8s"/>
<path class="edge edge-dataflow" data-edge="redis-a->aof-a" data-kind="dataflow" d="M145 445.5 L145 485.5" marker-end="url(#arrow)"/>
<path class="flow" data-flow="redis-a->aof-a" data-load="0.3" d="M145 445.5 L145 473.5" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-dataflow" data-edge="redis-b->aof-b" data-kind="dataflow" d="M145 669.5 L145 709.5" marker-end="url(#arrow)"/>
<path class="flow" data-flow="redis-b->aof-b" data-load="0.3" d="M145 669.5 L145 697.5" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge edge-replication" data-edge="cache-a->cache-b" data-kind="replication" d="M145 545.5 L145 585.5" marker-end="url(#arrow)"/>
<path class="flow" data-flow="cache-a->cache-b" data-load="0.2" d="M145 545.5 L145 573.5" style="stroke-width:2.1;animation-duration:2.5s"/>
</g>
<g class="nodes">
