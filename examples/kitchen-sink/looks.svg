<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 236" width="754" height="236" data-orrery="1">
<title>The looks a state can wear</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-label{font:700 11px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;letter-spacing:.1em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:3px;stroke-linejoin:round}
.group-label.centred{text-anchor:middle}
.group[data-collapsed] .group-box{fill-opacity:.7}
.summary-label{font:500 14px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.expand-mark{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.node-tech{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.replica-box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
.badge{font:600 12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:end;dominant-baseline:central;font-variant-numeric:tabular-nums}
.node[data-ghost]{opacity:.5}.node[data-ghost] .node-box{stroke-dasharray:3 3}.node[data-ghost] .node-label{font-style:italic}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.legend text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;dominant-baseline:central}.legend .legend-name{font-weight:600;fill:#0f172a}
.step-note{font:500 13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#334155;dominant-baseline:central}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}
.kind-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.gk-region .group-box{stroke-dasharray:8 6}
.gk-zone .group-box{stroke-dasharray:3 5}
.gk-cluster .group-box{stroke:#94a3b8}
.gk-boundary .group-box{stroke:#dc2626;fill-opacity:0;stroke-dasharray:8 6}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.st-degraded .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .node-label{fill:#92400e}
.st-degraded .group-label{fill:#92400e}
.st-failed .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .node-label{fill:#991b1b}
.st-failed .group-label{fill:#991b1b}
.st-off .node-box{stroke-dasharray:4 4}
.st-off .group-box{stroke-dasharray:4 4}
.st-off{opacity:0.45}
.st-warn .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-warn .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-warn .node-label{fill:#92400e}
.st-warn .group-label{fill:#92400e}
.st-alert .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-alert .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-alert .node-label{fill:#991b1b}
.st-alert .group-label{fill:#991b1b}
.st-muted .node-box{stroke-dasharray:4 4}
.st-muted .group-box{stroke-dasharray:4 4}
.st-muted{opacity:0.45}
.st-highlight .node-box{stroke:#2563eb;stroke-width:2;fill:#eff6ff}
.st-highlight .group-box{stroke:#2563eb;stroke-width:2;fill:#eff6ff}
.st-highlight .node-label{fill:#1e3a8a}
.st-highlight .group-label{fill:#1e3a8a}
.st-brownout .node-box{stroke:#7c3aed;stroke-width:2;fill:#f5f3ff;stroke-dasharray:4 4;animation:orrery-pulse 1.2s linear infinite}
.st-brownout .group-box{stroke:#7c3aed;stroke-width:2;fill:#f5f3ff;stroke-dasharray:4 4;animation:orrery-pulse 1.2s linear infinite}
.st-brownout .node-label{fill:#5b21b6}
.st-brownout .group-label{fill:#5b21b6}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker><marker id="arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12z" fill="#94a3b8"/></marker></defs>
<g class="scene">
<g class="view" data-view="default" data-open="" data-title="The looks a state can wear" data-size="754 236">
<g class="groups">

</g>
<g class="edges">

</g>
<g class="nodes">
<g class="node kind-service st-normal" data-node="a" data-kind="service" data-state="normal" data-bbox="20 20 80 48" transform="translate(20 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">normal</text>
</g>
<g class="node kind-service st-warn" data-node="b" data-kind="service" data-state="warn" data-bbox="140 20 80 48" transform="translate(140 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">warn</text>
</g>
<g class="node kind-service st-alert" data-node="c" data-kind="service" data-state="alert" data-pulse="1" data-bbox="260 20 80 48" transform="translate(260 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">alert</text>
</g>
<g class="node kind-service st-muted" data-node="d" data-kind="service" data-state="muted" data-bbox="380 20 80 48" transform="translate(380 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">muted</text>
</g>
<g class="node kind-service st-highlight" data-node="e" data-kind="service" data-state="highlight" data-bbox="500 20 101 48" transform="translate(500 20)">
<rect class="node-box" width="101" height="48" rx="8"/>
<text class="node-label" x="50.5" y="24">highlight</text>
</g>
<g class="node kind-service st-brownout" data-node="f" data-kind="service" data-state="brownout" data-pulse="1" data-bbox="641 20 93 48" transform="translate(641 20)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">your own</text>
</g>
</g>
<g class="legend" transform="translate(20 104)">
<g transform="translate(0 0)"><rect y="1" width="12" height="12" rx="3" style="fill:#ffffff;stroke:#64748b;stroke-width:1.5"/><text x="20" y="7"><tspan class="legend-name">normal</tspan>: The preset normal look</text></g>
<g transform="translate(0 22)"><rect y="1" width="12" height="12" rx="3" style="fill:#fffbeb;stroke:#d97706;stroke-width:1.5"/><text x="20" y="7"><tspan class="legend-name">warn</tspan>: The preset warn look</text></g>
<g transform="translate(0 44)"><rect y="1" width="12" height="12" rx="3" style="fill:#fef2f2;stroke:#dc2626;stroke-width:1.5"/><text x="20" y="7"><tspan class="legend-name">alert</tspan>: The preset alert look, pulsing</text></g>
<g transform="translate(0 66)"><rect y="1" width="12" height="12" rx="3" style="fill:#ffffff;stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 4;opacity:0.45"/><text x="20" y="7"><tspan class="legend-name">muted</tspan>: The preset muted look</text></g>
<g transform="translate(0 88)"><rect y="1" width="12" height="12" rx="3" style="fill:#eff6ff;stroke:#2563eb;stroke-width:1.5"/><text x="20" y="7"><tspan class="legend-name">highlight</tspan>: The preset highlight look</text></g>
<g transform="translate(0 110)"><rect y="1" width="12" height="12" rx="3" style="fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:4 4"/><text x="20" y="7"><tspan class="legend-name">brownout</tspan>: Your own style object</text></g>
</g>
</g>
</g>
</svg>
