.gk-azure\:resource-group .group-box{stroke:#0078d4;stroke-dasharray:8 6}
.gk-azure\:region .group-box{stroke:#0078d4;stroke-dasharray:3 5}
.gk-azure\:availability-zone .group-box{stroke:#0078d4;stroke-dasharray:3 5}
.gk-azure\:vnet .group-box{stroke:#008272;stroke-dasharray:8 6}
.gk-azure\:subnet .group-box{stroke:#008272;fill:#e5f4f2}
.gk-azure\:on-premises .group-box{stroke:#5c5c5c;stroke-dasharray:8 6}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
