<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 178" width="638" height="178" data-orrery="1">
<title>The sre states pack</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:4px;stroke-linejoin:round}
.group-label.centred{text-anchor:middle}
.group[data-collapsed] .group-box{fill-opacity:.7}
.summary-label{font:500 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.expand-mark{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.node-tech{font:11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central}
.replica-box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
.badge{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:end;dominant-baseline:central}
.node[data-ghost]{opacity:.5}.node[data-ghost] .node-box{stroke-dasharray:3 3}.node[data-ghost] .node-label{font-style:italic}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.legend text{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;dominant-baseline:central}.legend .legend-name{font-weight:600;fill:#0f172a}
.step-note{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;dominant-baseline:central}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}
.kind-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.gk-region .group-box{stroke-dasharray:8 6}
.gk-zone .group-box{stroke-dasharray:3 5}
.gk-cluster .group-box{stroke:#94a3b8}
.gk-boundary .group-box{stroke:#dc2626;fill-opacity:0;stroke-dasharray:8 6}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.st-impaired .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-impaired .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-impaired .node-label{fill:#92400e}
.st-impaired .group-label{fill:#92400e}
.st-brownout .node-box{stroke:#7c3aed;stroke-width:2;fill:#f5f3ff;animation:orrery-pulse 1.2s linear infinite}
.st-brownout .group-box{stroke:#7c3aed;stroke-width:2;fill:#f5f3ff;animation:orrery-pulse 1.2s linear infinite}
.st-brownout .node-label{fill:#5b21b6}
.st-brownout .group-label{fill:#5b21b6}
.st-outage .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-outage .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-outage .node-label{fill:#991b1b}
.st-outage .group-label{fill:#991b1b}
.st-drained .node-box{stroke-dasharray:4 4}
.st-drained .group-box{stroke-dasharray:4 4}
.st-drained{opacity:0.45}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker><marker id="arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12z" fill="#94a3b8"/></marker></defs>
<g class="scene">
<g class="view" data-view="default" data-open="" data-title="The sre states pack" data-size="638 178">
<g class="groups">

</g>
<g class="edges">

</g>
<g class="nodes">
<g class="node kind-service st-healthy" data-node="a" data-kind="service" data-state="healthy" data-bbox="20 20 86 48" transform="translate(20 20)">
<rect class="node-box" width="86" height="48" rx="8"/>
<text class="node-label" x="43" y="24">healthy</text>
</g>
<g class="node kind-service st-impaired" data-node="b" data-kind="service" data-state="impaired" data-bbox="146 20 93 48" transform="translate(146 20)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">impaired</text>
</g>
<g class="node kind-service st-brownout" data-node="c" data-kind="service" data-state="brownout" data-pulse="1" data-bbox="279 20 93 48" transform="translate(279 20)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">brownout</text>
</g>
<g class="node kind-service st-outage" data-node="d" data-kind="service" data-state="outage" data-pulse="1" data-bbox="412 20 80 48" transform="translate(412 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">outage</text>
</g>
<g class="node kind-service st-drained" data-node="e" data-kind="service" data-state="drained" data-bbox="532 20 86 48" transform="translate(532 20)">
<rect class="node-box" width="86" height="48" rx="8"/>
<text class="node-label" x="43" y="24">drained</text>
</g>
</g>
<g class="legend" transform="translate(20 96)">
<g transform="translate(0 0)"><rect width="14" height="14" rx="3" style="fill:#fffbeb;stroke:#d97706;stroke-width:1.5"/><text x="22" y="7"><tspan class="legend-name">impaired</tspan>: Serving; redundancy or latency SLO breached</text></g>
<g transform="translate(0 20)"><rect width="14" height="14" rx="3" style="fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5"/><text x="22" y="7"><tspan class="legend-name">brownout</tspan>: Serving with a feature switched off</text></g>
<g transform="translate(0 40)"><rect width="14" height="14" rx="3" style="fill:#fef2f2;stroke:#dc2626;stroke-width:1.5"/><text x="22" y="7"><tspan class="legend-name">outage</tspan>: Customer-visible failure</text></g>
<g transform="translate(0 60)"><rect width="14" height="14" rx="3" style="fill:#ffffff;stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 4;opacity:0.45"/><text x="22" y="7"><tspan class="legend-name">drained</tspan>: Deliberately out of rotation</text></g>
</g>
</g>
</g>
</svg>
