<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 533 616" width="533" height="616" data-orrery="1">
<title>The connection kinds and their loads</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-label{font:700 11px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;letter-spacing:.1em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:3px;stroke-linejoin:round}
.group-label.centred{text-anchor:middle}
.group[data-collapsed] .group-box{fill-opacity:.7}
.summary-label{font:500 14px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.expand-mark{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.node-tech{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.replica-box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
.badge{font:600 12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:end;dominant-baseline:central;font-variant-numeric:tabular-nums}
.node[data-ghost]{opacity:.5}.node[data-ghost] .node-box{stroke-dasharray:3 3}.node[data-ghost] .node-label{font-style:italic}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.legend text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;dominant-baseline:central}.legend .legend-name{font-weight:600;fill:#0f172a}
.step-note{font:500 13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#334155;dominant-baseline:central}
.lifeline{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
.activation{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1}
.message.reply .edge{stroke-dasharray:6 5}
.callout-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.callout-leader{fill:none;stroke:#64748b;stroke-width:1.5}
.callout-text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#334155;dominant-baseline:central}
.heading-back{fill:#ffffff}
.heading-title{font:600 16px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a}
.heading-text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b}
.heading-title.centred,.heading-text.centred{text-anchor:middle}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}
.kind-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.gk-region .group-box{stroke-dasharray:8 6}
.gk-zone .group-box{stroke-dasharray:3 5}
.gk-cluster .group-box{stroke:#94a3b8}
.gk-boundary .group-box{stroke:#dc2626;fill-opacity:0;stroke-dasharray:8 6}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.edge-gossip{stroke:#0891b2;stroke-width:2;stroke-dasharray:2 3}
.st-degraded .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .node-label{fill:#92400e}
.st-degraded .group-label{fill:#92400e}
.st-failed .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .node-label{fill:#991b1b}
.st-failed .group-label{fill:#991b1b}
.st-off .node-box{stroke-dasharray:4 4}
.st-off .group-box{stroke-dasharray:4 4}
.st-off{opacity:0.45}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker><marker id="arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12z" fill="#94a3b8"/></marker></defs>
<g class="scene">
<g class="view" data-view="default" data-open="" data-title="The connection kinds and their loads" data-size="533 616">
<g class="groups">

</g>
<g class="edges">
<path class="edge edge-sync" data-edge="src->sync" data-kind="sync" d="M100 44 L321 44" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->sync" data-load="1" d="M100 44 L309 44" style="stroke-width:4.5;animation-duration:0.5s"/>
<text class="edge-label" x="240.5" y="55">sync</text>
<path class="edge edge-async" data-edge="src->async" data-kind="async" d="M100 50 L175 50 L175 132 L321 132" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->async" data-load="0.6" d="M100 50 L175 50 L175 132 L309 132" style="stroke-width:3.3;animation-duration:1.5s"/>
<text class="edge-label" x="240.5" y="143">async</text>
<path class="edge edge-replication" data-edge="src->replication" data-kind="replication" d="M100 56 L165 56 L165 220 L321 220" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->replication" data-load="0.3" d="M100 56 L165 56 L165 220 L309 220" style="stroke-width:2.4;animation-duration:2.3s"/>
<text class="edge-label" x="240.5" y="231">replication</text>
<path class="edge edge-dataflow" data-edge="src->dataflow" data-kind="dataflow" d="M100 62 L155 62 L155 308 L321 308" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->dataflow" data-load="0.8" d="M100 62 L155 62 L155 308 L309 308" style="stroke-width:3.9;animation-duration:1s"/>
<text class="edge-label" x="240.5" y="319">dataflow</text>
<path class="edge edge-gossip" data-edge="src->gossip" data-kind="gossip" d="M100 68 L145 68 L145 396 L321 396" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->gossip" data-load="0.5" d="M100 68 L145 68 L145 396 L309 396" style="stroke-width:3;animation-duration:1.8s;stroke:#0891b2"/>
<text class="edge-label" x="240.5" y="407">gossip</text>
<path class="edge edge-sync" data-edge="src->idle" data-kind="sync" d="M100 74 L135 74 L135 484 L321 484" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->idle" data-load="0" d="M100 74 L135 74 L135 484 L309 484" style="stroke-width:1.5;animation:none;opacity:0"/>
<text class="edge-label" x="240.5" y="495">no load</text>
<path class="edge edge-sync" data-edge="src->both" data-kind="sync" d="M100 80 L125 80 L125 572 L321 572" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<path class="flow" data-flow="src->both" data-load="0.4" d="M112 80 L125 80 L125 572 L309 572" style="stroke-width:2.7;animation-duration:2s"/>
<text class="edge-label" x="240.5" y="583">both ways</text>
</g>
<g class="nodes">
<g class="node kind-service st-on" data-node="src" data-kind="service" data-state="on" data-bbox="20 38 80 48" transform="translate(20 38)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">Source</text>
</g>
<g class="node kind-service st-on" data-node="sync" data-kind="service" data-state="on" data-bbox="321 20 124 48" transform="translate(321 20)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">sync, load 1</text>
</g>
<g class="node kind-service st-on" data-node="async" data-kind="service" data-state="on" data-bbox="321 108 146 48" transform="translate(321 108)">
<rect class="node-box" width="146" height="48" rx="8"/>
<text class="node-label" x="73" y="24">async, load 0.6</text>
</g>
<g class="node kind-service st-on" data-node="replication" data-kind="service" data-state="on" data-bbox="321 196 192 48" transform="translate(321 196)">
<rect class="node-box" width="192" height="48" rx="8"/>
<text class="node-label" x="96" y="24">replication, load 0.3</text>
</g>
<g class="node kind-service st-on" data-node="dataflow" data-kind="service" data-state="on" data-bbox="321 284 169 48" transform="translate(321 284)">
<rect class="node-box" width="169" height="48" rx="8"/>
<text class="node-label" x="84.5" y="24">dataflow, load 0.8</text>
</g>
<g class="node kind-service st-on" data-node="gossip" data-kind="service" data-state="on" data-bbox="321 372 169 48" transform="translate(321 372)">
<rect class="node-box" width="169" height="48" rx="8"/>
<text class="node-label" x="84.5" y="24">your own, load 0.5</text>
</g>
<g class="node kind-service st-on" data-node="idle" data-kind="service" data-state="on" data-bbox="321 460 80 48" transform="translate(321 460)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">load 0</text>
</g>
<g class="node kind-service st-on" data-node="both" data-kind="service" data-state="on" data-bbox="321 548 131 48" transform="translate(321 548)">
<rect class="node-box" width="131" height="48" rx="8"/>
<text class="node-label" x="65.5" y="24">bidirectional</text>
</g>
</g>
</g>
</g>
</svg>
