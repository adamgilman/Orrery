<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403.4 610" width="403.4" height="610" data-orrery="1">
<title>States on connections</title>
<style>tspan{dominant-baseline:inherit}
.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-label{font:700 11px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;letter-spacing:.1em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:3px;stroke-linejoin:round}
.group-label.centred{text-anchor:middle}
.group[data-collapsed] .group-box{fill-opacity:.7}
.summary-label{font:500 14px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.expand-mark,.collapse-mark{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round}
.collapse-mark{cursor:pointer}.collapse-mark rect{fill:#f8fafc}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.node-tech{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.replica-box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;pointer-events:none}
.badge{font:600 12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:end;dominant-baseline:central;font-variant-numeric:tabular-nums}
.node[data-ghost]{opacity:.5}.node[data-ghost] .node-box{stroke-dasharray:3 3}.node[data-ghost] .node-label{font-style:italic}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.legend text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b;dominant-baseline:central}.legend .legend-name{font-weight:600;fill:#0f172a}
.step-note{font:500 13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#334155;dominant-baseline:central}
.callout-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.callout-leader{fill:none;stroke:#64748b;stroke-width:1.5}
.callout-text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#334155;dominant-baseline:central}
.heading-back{fill:#ffffff}
.backing{fill:#ffffff}
.heading-title{font:600 16px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a}
.heading-text{font:12px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#64748b}
.heading-title.centred,.heading-text.centred{text-anchor:middle}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}
.kind-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.gk-region .group-box{stroke-dasharray:8 6}
.gk-zone .group-box{stroke-dasharray:3 5}
.gk-cluster .group-box{stroke:#94a3b8}
.gk-boundary .group-box{stroke:#dc2626;fill-opacity:0;stroke-dasharray:8 6}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.st-degraded .node-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .group-box{stroke:#d97706;stroke-width:2;fill:#fffbeb}
.st-degraded .node-label{fill:#92400e}
.st-degraded .group-label{fill:#92400e}
.edge.st-degraded{stroke:#d97706}
.st-failed .node-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .group-box{stroke:#dc2626;stroke-width:2;fill:#fef2f2;animation:orrery-pulse 1.2s linear infinite}
.st-failed .node-label{fill:#991b1b}
.st-failed .group-label{fill:#991b1b}
.edge.st-failed{stroke:#dc2626;animation:orrery-pulse 1.2s linear infinite}
.st-off .node-box{stroke-dasharray:4 4}
.st-off .group-box{stroke-dasharray:4 4}
.st-off{opacity:0.45}
.edge.st-off{stroke-dasharray:4 4}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker><marker id="arrow-start" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12z" fill="#94a3b8"/></marker><marker id="arrow-st-degraded" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#d97706"/></marker><marker id="arrow-st-failed" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#dc2626"/></marker></defs>
<rect class="backing" x="0" y="0" width="403.4" height="610" rx="8"/>
<g class="scene">
<g class="view" data-view="default" data-open="" data-title="States on connections" data-size="403.4 610">
<g class="groups">

</g>
<g class="edges">
<path class="edge edge-sync" data-edge="to-on" data-kind="sync" d="M134 44 L224 44" marker-end="url(#arrow)"/>
<path class="flow" data-flow="to-on" data-load="0.6" d="M134 44 L212 44" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync st-degraded" data-edge="to-degraded" data-kind="sync" data-state="degraded" d="M134 50.9 L199 50.9 L199 132 L224 132" marker-end="url(#arrow-st-degraded)"/>
<path class="flow" data-flow="to-degraded" data-load="0.6" d="M134 50.9 L199 50.9 L199 132 L212 132" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync st-failed" data-edge="to-failed" data-kind="sync" data-state="failed" data-pulse="1" d="M134 57.7 L189 57.7 L189 220 L224 220" marker-end="url(#arrow-st-failed)"/>
<path class="flow" data-flow="to-failed" data-load="0" d="M134 57.7 L189 57.7 L189 220 L212 220" style="stroke-width:1.5;animation:none;opacity:0"/>
<path class="edge edge-sync st-off" data-edge="to-off" data-kind="sync" data-state="off" d="M134 64.6 L179 64.6 L179 308 L224 308" marker-end="url(#arrow)"/>
<path class="flow" data-flow="to-off" data-load="0" d="M134 64.6 L179 64.6 L179 308 L212 308" style="stroke-width:1.5;animation:none;opacity:0"/>
<path class="edge edge-sync" data-edge="src->idle" data-kind="sync" d="M134 71.4 L169 71.4 L169 396 L224 396" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->idle" data-load="0" d="M134 71.4 L169 71.4 L169 396 L212 396" style="stroke-width:1.5;animation:none;opacity:0"/>
<path class="edge edge-sync" data-edge="src->down" data-kind="sync" d="M134 78.3 L159 78.3 L159 484 L224 484" marker-end="url(#arrow)"/>
<path class="flow" data-flow="src->down" data-load="0" d="M134 78.3 L159 78.3 L159 484 L212 484" style="stroke-width:1.5;animation:none;opacity:0"/>
</g>
<g class="nodes">
<g class="node kind-client st-on" data-node="src" data-kind="client" data-state="on" data-bbox="20 37.1 114 48" transform="translate(20 37.1)">
<rect class="node-box" width="114" height="48" rx="24"/>
<g class="glyph" transform="translate(18 16)"><rect x="1.5" y="2.5" width="13" height="9" rx="1"/><path d="M5 14.5h6M8 11.5v3"/></g>
<text class="node-label" x="75" y="24">Caller</text>
</g>
<g class="node kind-service st-on" data-node="on" data-kind="service" data-state="on" data-bbox="224 20 80 48" transform="translate(224 20)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">on</text>
</g>
<g class="node kind-service st-on" data-node="degraded" data-kind="service" data-state="on" data-bbox="224 108 93 48" transform="translate(224 108)">
<rect class="node-box" width="93" height="48" rx="8"/>
<text class="node-label" x="46.5" y="24">degraded</text>
</g>
<g class="node kind-service st-on" data-node="failed" data-kind="service" data-state="on" data-bbox="224 196 80 48" transform="translate(224 196)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">failed</text>
</g>
<g class="node kind-service st-on" data-node="off" data-kind="service" data-state="on" data-bbox="224 284 80 48" transform="translate(224 284)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">off</text>
</g>
<g class="node kind-service st-on" data-node="idle" data-kind="service" data-state="on" data-bbox="224 372 80 48" transform="translate(224 372)">
<rect class="node-box" width="80" height="48" rx="8"/>
<text class="node-label" x="40" y="24">load 0</text>
</g>
<g class="node kind-service st-failed" data-node="down" data-kind="service" data-state="failed" data-pulse="1" data-bbox="224 460 124 48" transform="translate(224 460)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">a failed box</text>
</g>
</g>
<g class="legend" transform="translate(20 544)">
<g transform="translate(0 0)"><path d="M0 7H12" style="fill:none;stroke:#d97706;stroke-width:2"/><text x="20" y="7"><tspan class="legend-name">degraded</tspan>: Working with reduced redundancy or capacity</text></g>
<g transform="translate(0 22)"><rect y="1" width="12" height="12" rx="3" style="fill:#fef2f2;stroke:#dc2626;stroke-width:1.5"/><text x="20" y="7"><tspan class="legend-name">failed</tspan>: Broken</text></g>
<g transform="translate(0 44)"><path d="M0 7H12" style="fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:4 4;opacity:0.45"/><text x="20" y="7"><tspan class="legend-name">off</tspan>: Deliberately switched off</text></g>
</g>
</g>
</g>
</svg>
