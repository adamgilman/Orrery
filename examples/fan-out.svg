<path class="edge" data-edge="s1->cache" d="M70.5 176 L70.5 201 L191.5 201 L191.5 226" marker-end="url(#arrow)"/>
<path class="flow" data-flow="s1->cache" data-load="1" d="M70.5 176 L70.5 201 L191.5 201 L191.5 214" style="stroke-width:4.5;animation-duration:0.5s"/>
<path class="edge" data-edge="s2->cache" d="M211.5 176 L211.5 226" marker-end="url(#arrow)"/>
<path class="flow" data-flow="s2->cache" data-load="0" d="M211.5 176 L211.5 214" style="stroke-width:1.5;animation:none;opacity:0"/>
<path class="edge" data-edge="s3->cache" d="M352.5 176 L352.5 201 L231.5 201 L231.5 226" marker-end="url(#arrow)"/>
<path class="flow" data-flow="s3->cache" data-load="0.5" d="M352.5 176 L352.5 201 L231.5 201 L231.5 214" style="stroke-width:3;animation-duration:1.8s"/>
