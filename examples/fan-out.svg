<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 324" width="423" height="324" data-orrery="1">
<style>.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<g class="edges">
<path class="edge" data-edge="lb->s1" d="M70.5 68 L70.5 138" marker-end="url(#arrow)"/>
<path class="flow" data-flow="lb->s1" d="M70.5 68 L70.5 126" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge" data-edge="lb->s2" d="M103.3 68 L103.3 103 L211.5 103 L211.5 138" marker-end="url(#arrow)"/>
<path class="flow" data-flow="lb->s2" d="M103.3 68 L103.3 103 L211.5 103 L211.5 126" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge" data-edge="lb->s3" d="M136 68 L136 93 L352.5 93 L352.5 138" marker-end="url(#arrow)"/>
<path class="flow" data-flow="lb->s3" d="M136 68 L136 93 L352.5 93 L352.5 126" style="stroke-width:2.4;animation-duration:2.3s"/>
<path class="edge" data-edge="s1->cache" d="M70.5 186 L70.5 211 L191.5 211 L191.5 256" marker-end="url(#arrow)"/>
<path class="flow" data-flow="s1->cache" d="M70.5 186 L70.5 211 L191.5 211 L191.5 244" style="stroke-width:4.5;animation-duration:0.5s"/>
<path class="edge" data-edge="s2->cache" d="M211.5 186 L211.5 256" marker-end="url(#arrow)"/>
<path class="flow" data-flow="s2->cache" d="M211.5 186 L211.5 244" style="stroke-width:1.5;animation:none;opacity:0"/>
<path class="edge" data-edge="s3->cache" d="M352.5 186 L352.5 211 L231.5 211 L231.5 256" marker-end="url(#arrow)"/>
<path class="flow" data-flow="s3->cache" d="M352.5 186 L352.5 211 L231.5 211 L231.5 244" style="stroke-width:3;animation-duration:1.8s"/>
</g>
<g class="nodes">
<g class="node" data-node="lb" transform="translate(37.8 20)">
<rect class="node-box" width="131" height="48" rx="8"/>
<text class="node-label" x="65.5" y="24">Load balancer</text>
</g>
<g class="node" data-node="s1" transform="translate(20 138)">
<rect class="node-box" width="101" height="48" rx="8"/>
<text class="node-label" x="50.5" y="24">Service 1</text>
</g>
<g class="node" data-node="s2" transform="translate(161 138)">
<rect class="node-box" width="101" height="48" rx="8"/>
<text class="node-label" x="50.5" y="24">Service 2</text>
</g>
<g class="node" data-node="s3" transform="translate(302 138)">
<rect class="node-box" width="101" height="48" rx="8"/>
<text class="node-label" x="50.5" y="24">Service 3</text>
</g>
<g class="node" data-node="cache" transform="translate(171.5 256)">
