<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1677 392" width="1677" height="392" data-orrery="1">
<title>us-east-1 only</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-region .group-box{stroke-dasharray:8 6}
.group-zone .group-box{stroke-dasharray:3 5}
.group-cluster .group-box{stroke:#94a3b8}
.group-boundary .group-box{stroke:#dc2626;stroke-dasharray:6 6;fill:none}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:#f1f5f9;stroke-width:4px;stroke-linejoin:round}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.node-state-failed .node-box{fill:#fef2f2;stroke:#dc2626;stroke-width:2;animation:orrery-pulse 1.2s linear infinite}
.node-state-failed .node-label{fill:#991b1b}
.node-state-degraded .node-box{fill:#fffbeb;stroke:#d97706;stroke-width:2}
.node-state-degraded .node-label{fill:#92400e}
.node-state-off{opacity:.45}
.node-state-off .node-box{stroke-dasharray:4 4}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}
@keyframes orrery-pulse{0%{stroke-opacity:1}50%{stroke-opacity:0.4}100%{stroke-opacity:1}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker></defs>
<g class="groups">
<g class="group group-region" data-group="region">
<rect class="group-box" x="20" y="20" width="1637" height="352" rx="10"/>
<text class="group-label" x="32" y="36">us-east-1</text>
</g>
<g class="group group-tier" data-group="app">
<rect class="group-box" x="32" y="56" width="338" height="170" rx="10"/>
<text class="group-label" x="44" y="72">Application</text>
</g>
<g class="group group-tier" data-group="data">
<rect class="group-box" x="1215" y="150" width="430" height="210" rx="10"/>
<text class="group-label" x="1227" y="166">Data</text>
</g>
<g class="group group-tier" data-group="async">
<rect class="group-box" x="589" y="223" width="541" height="122" rx="10"/>
<text class="group-label" x="601" y="239">Async</text>
</g>
</g>
<g class="edges">
<path class="edge edge-sync" data-edge="api->pricing" data-kind="sync" d="M168 116 L248 116" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->pricing" data-load="0.6" d="M168 116 L236 116" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync" data-edge="api->cache" data-kind="sync" d="M168 132 L213 132 L213 181 L402.5 181 L402.5 171 L1172.5 171 L1172.5 236 L1227 236" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->cache" data-load="0.6" d="M168 132 L213 132 L213 181 L402.5 181 L402.5 171 L1172.5 171 L1172.5 236 L1215 236" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync" data-edge="api->db" data-kind="sync" d="M168 140 L203 140 L203 197 L1162.5 197 L1162.5 316 L1237 316" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->db" data-load="0.5" d="M168 140 L203 140 L203 197 L1162.5 197 L1162.5 316 L1225 316" style="stroke-width:3;animation-duration:1.8s"/>
<text class="edge-label" x="484.5" y="208">writes</text>
<path class="edge edge-sync" data-edge="api-reads" data-kind="sync" d="M168 124 L223 124 L223 165 L402.5 165 L402.5 126 L1182.5 126 L1182.5 186 L1407 186 L1407 308 L1432 308" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api-reads" data-load="0" d="M168 124 L223 124 L223 165 L402.5 165 L402.5 126 L1182.5 126 L1182.5 186 L1407 186 L1407 308 L1420 308" style="stroke-width:1.5;animation:none;opacity:0"/>
<text class="edge-label" x="484.5" y="137">reads (failover)</text>
<path class="edge edge-replication" data-edge="db->replica" data-kind="replication" d="M1362 324 L1432 324" marker-end="url(#arrow)"/>
<path class="flow" data-flow="db->replica" data-load="0.2" d="M1362 324 L1420 324" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-async" data-edge="api->queue" data-kind="async" d="M168 148 L193 148 L193 213 L402.5 213 L402.5 291 L601 291" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->queue" data-load="0.4" d="M168 148 L193 148 L193 213 L402.5 213 L402.5 291 L589 291" style="stroke-width:2.7;animation-duration:2s"/>
<text class="edge-label" x="484.5" y="302">order.placed</text>
<path class="edge edge-async" data-edge="queue->worker" data-kind="async" d="M749 291 L789 291" marker-end="url(#arrow)"/>
<path class="flow" data-flow="queue->worker" data-load="0.4" d="M749 291 L777 291" style="stroke-width:2.7;animation-duration:2s"/>
<path class="edge edge-dataflow" data-edge="worker->s3" data-kind="dataflow" d="M951 283 L1001 283" marker-end="url(#arrow)"/>
<path class="flow" data-flow="worker->s3" data-load="0.2" d="M951 283 L989 283" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-sync" data-edge="worker->db" data-kind="sync" d="M951 299 L976 299 L976 332 L1237 332" marker-end="url(#arrow)"/>
<path class="flow" data-flow="worker->db" data-load="0.1" d="M951 299 L976 299 L976 332 L1225 332" style="stroke-width:1.8;animation-duration:2.8s"/>
</g>
<g class="nodes">
<g class="node node-service" data-node="api" data-kind="service" data-state="on" transform="translate(44 108)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">Checkout API</text>
</g>
<g class="node node-function" data-node="pricing" data-kind="function" data-state="on" transform="translate(248 92)">
<rect class="node-box" width="110" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><text class="glyph-text" x="8" y="8.5">λ</text></g>
<text class="node-label" x="73" y="24">Pricing</text>
</g>
<g class="node node-cache" data-node="cache" data-kind="cache" data-state="on" transform="translate(1227 212)">
<rect class="node-box" width="155" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M9 1.5L3 9h4.5l-1 5.5L13 7H8.5z"/></g>
<text class="node-label" x="95.5" y="24">Session cache</text>
</g>
<g class="node node-database" data-node="db" data-kind="database" data-state="on" transform="translate(1237 300)">
<rect class="node-box" width="125" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="80.5" y="24">Orders DB</text>
</g>
<g class="node node-database" data-node="replica" data-kind="database" data-state="on" transform="translate(1432 292)">
<rect class="node-box" width="201" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="118.5" y="24">Orders DB (replica)</text>
</g>
<g class="node node-queue" data-node="queue" data-kind="queue" data-state="on" transform="translate(601 267)">
<rect class="node-box" width="148" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><rect x="1.5" y="5" width="3.5" height="6" rx=".5"/><rect x="6.25" y="5" width="3.5" height="6" rx=".5"/><rect x="11" y="5" width="3.5" height="6" rx=".5"/></g>
<text class="node-label" x="92" y="24">Order events</text>
</g>
<g class="node node-service" data-node="worker" data-kind="service" data-state="on" transform="translate(789 267)">
<rect class="node-box" width="162" height="48" rx="8"/>
<text class="node-label" x="81" y="24">Fulfilment worker</text>
</g>
<g class="node node-storage" data-node="s3" data-kind="storage" data-state="on" transform="translate(1001 259)">
<rect class="node-box" width="117" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M2 3.5h12l-1.5 10.5h-9z"/><path d="M2 3.5c0 1.2 2.7 2 6 2s6-.8 6-2"/></g>
<text class="node-label" x="76.5" y="24">Receipts</text>
</g>
</g>
</svg>
