<text class="edge-label" x="471.5" y="208">writes</text>
<path class="edge edge-sync" data-edge="api-reads" data-kind="sync" d="M168 124 L223 124 L223 165 L402.5 165 L402.5 126 L1156.5 126 L1156.5 186 L1381 186 L1381 308 L1406 308" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api-reads" data-load="0.4" d="M168 124 L223 124 L223 165 L402.5 165 L402.5 126 L1156.5 126 L1156.5 186 L1381 186 L1381 308 L1394 308" style="stroke-width:2.7;animation-duration:2s"/>
<text class="edge-label" x="471.5" y="137">reads</text>
<path class="edge edge-replication" data-edge="db->replica" data-kind="replication" d="M1336 324 L1406 324" marker-end="url(#arrow)"/>
<path class="flow" data-flow="db->replica" data-load="0.2" d="M1336 324 L1394 324" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-async" data-edge="api->queue" data-kind="async" d="M168 148 L193 148 L193 213 L402.5 213 L402.5 291 L575 291" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->queue" data-load="0.4" d="M168 148 L193 148 L193 213 L402.5 213 L402.5 291 L563 291" style="stroke-width:2.7;animation-duration:2s"/>
<text class="edge-label" x="471.5" y="302">order.placed</text>
<path class="edge edge-async" data-edge="queue->worker" data-kind="async" d="M723 291 L763 291" marker-end="url(#arrow)"/>
<path class="flow" data-flow="queue->worker" data-load="0.4" d="M723 291 L751 291" style="stroke-width:2.7;animation-duration:2s"/>
<path class="edge edge-dataflow" data-edge="worker->s3" data-kind="dataflow" d="M925 283 L975 283" marker-end="url(#arrow)"/>
<path class="flow" data-flow="worker->s3" data-load="0.2" d="M925 283 L963 283" style="stroke-width:2.1;animation-duration:2.5s"/>
<path class="edge edge-sync" data-edge="worker->db" data-kind="sync" d="M925 299 L950 299 L950 332 L1211 332" marker-end="url(#arrow)"/>
<path class="flow" data-flow="worker->db" data-load="0.1" d="M925 299 L950 299 L950 332 L1199 332" style="stroke-width:1.8;animation-duration:2.8s"/>
</g>
<g class="nodes">
<g class="node node-service" data-node="api" data-kind="service" transform="translate(44 108)">
<rect class="node-box" width="124" height="48" rx="8"/>
<text class="node-label" x="62" y="24">Checkout API</text>
</g>
<g class="node node-function" data-node="pricing" data-kind="function" transform="translate(248 92)">
<rect class="node-box" width="110" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><text class="glyph-text" x="8" y="8.5">λ</text></g>
<text class="node-label" x="73" y="24">Pricing</text>
</g>
<g class="node node-cache" data-node="cache" data-kind="cache" transform="translate(1201 212)">
<rect class="node-box" width="155" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M9 1.5L3 9h4.5l-1 5.5L13 7H8.5z"/></g>
<text class="node-label" x="95.5" y="24">Session cache</text>
</g>
<g class="node node-database" data-node="db" data-kind="database" transform="translate(1211 300)">
<rect class="node-box" width="125" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="80.5" y="24">Orders DB</text>
</g>
<g class="node node-database" data-node="replica" data-kind="database" transform="translate(1406 292)">
<rect class="node-box" width="201" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><ellipse cx="8" cy="4" rx="6" ry="2.5"/><path d="M2 4v8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V4"/></g>
<text class="node-label" x="118.5" y="24">Orders DB (replica)</text>
</g>
<g class="node node-queue" data-node="queue" data-kind="queue" transform="translate(575 267)">
<rect class="node-box" width="148" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><rect x="1.5" y="5" width="3.5" height="6" rx=".5"/><rect x="6.25" y="5" width="3.5" height="6" rx=".5"/><rect x="11" y="5" width="3.5" height="6" rx=".5"/></g>
<text class="node-label" x="92" y="24">Order events</text>
</g>
<g class="node node-service" data-node="worker" data-kind="service" transform="translate(763 267)">
<rect class="node-box" width="162" height="48" rx="8"/>
<text class="node-label" x="81" y="24">Fulfilment worker</text>
</g>
<g class="node node-storage" data-node="s3" data-kind="storage" transform="translate(975 259)">
<rect class="node-box" width="117" height="48" rx="8"/>
<g class="glyph" transform="translate(12 16)"><path d="M2 3.5h12l-1.5 10.5h-9z"/><path d="M2 3.5c0 1.2 2.7 2 6 2s6-.8 6-2"/></g>
<text class="node-label" x="76.5" y="24">Receipts</text>
</g>
</g>
</svg>
