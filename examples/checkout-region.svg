<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1651 392" width="1651" height="392" data-orrery="1">
<title>us-east-1 only</title>
<style>.group-box{fill:#e2e8f0;fill-opacity:.35;stroke:#cbd5e1;stroke-width:1.5}
.group-region .group-box{stroke-dasharray:8 6}
.group-zone .group-box{stroke-dasharray:3 5}
.group-cluster .group-box{stroke:#94a3b8}
.group-boundary .group-box{stroke:#dc2626;stroke-dasharray:6 6;fill:none}
.group-label{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;letter-spacing:.06em;text-transform:uppercase}
.node-box{fill:#ffffff;stroke:#64748b;stroke-width:1.5}
.node-external .node-box{stroke-dasharray:5 4;fill:#f8fafc}
.glyph{fill:none;stroke:#475569;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.glyph-text{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central}
.node-label{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.5}
.edge-async{stroke-dasharray:6 5}
.edge-replication{stroke-dasharray:2 4}
.edge-dataflow{stroke-width:3}
.flow{fill:none;stroke:#2563eb;stroke-linecap:round;stroke-dasharray:6 10;animation:orrery-flow 1s linear infinite}
.edge-label{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#475569;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
@keyframes orrery-flow{to{stroke-dashoffset:-16}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94a3b8"/></marker></defs>
<g class="groups">
<g class="group group-region" data-group="region">
<rect class="group-box" x="20" y="20" width="1611" height="352" rx="10"/>
<text class="group-label" x="32" y="36">us-east-1</text>
</g>
<g class="group group-tier" data-group="app">
<rect class="group-box" x="32" y="56" width="338" height="170" rx="10"/>
<text class="group-label" x="44" y="72">Application</text>
</g>
<g class="group group-tier" data-group="data">
<rect class="group-box" x="1189" y="150" width="430" height="210" rx="10"/>
<text class="group-label" x="1201" y="166">Data</text>
</g>
<g class="group group-tier" data-group="async">
<rect class="group-box" x="563" y="223" width="541" height="122" rx="10"/>
<text class="group-label" x="575" y="239">Async</text>
</g>
</g>
<g class="edges">
<path class="edge edge-sync" data-edge="api->pricing" data-kind="sync" d="M168 116 L248 116" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->pricing" data-load="0.6" d="M168 116 L236 116" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync" data-edge="api->cache" data-kind="sync" d="M168 132 L213 132 L213 181 L402.5 181 L402.5 171 L1146.5 171 L1146.5 236 L1201 236" marker-end="url(#arrow)"/>
<path class="flow" data-flow="api->cache" data-load="0.6" d="M168 132 L213 132 L213 181 L402.5 181 L402.5 171 L1146.5 171 L1146.5 236 L1189 236" style="stroke-width:3.3;animation-duration:1.5s"/>
<path class="edge edge-sync" data-edge="api->db" data-kind="sync" d="M168 140 L203 140 L203 197 L1136.5 197 L1136.5 316 L1211 316" marker-end="url(#arrow)"/>
