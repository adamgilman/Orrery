<path class="flow" data-flow="order-events->fulfillment-fn" data-load="0.5" d="M600.8 611 L600.8 655.5 L872.6 655.5 L872.6 388.5 L658.9 388.5 L658.9 368" style="stroke-width:3;animation-duration:1.8s"/>
