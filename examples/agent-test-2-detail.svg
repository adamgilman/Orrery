<g class="glyph" transform="translate(12 16)"><rect x="1.5" y="5" width="3.5" height="6" rx=".5"/><rect x="6.25" y="5" width="3.5" height="6" rx=".5"/><rect x="11" y="5" width="3.5" height="6" rx=".5"/></g>
<text class="node-label" x="92" y="24">Order events</text>
</g>
<g class="node node-function" data-node="fulfillment-fn" data-kind="function" transform="translate(530.3 308)">
