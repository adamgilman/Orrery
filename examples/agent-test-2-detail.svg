<path class="flow" data-flow="checkout-us->order-events" data-load="0.5" d="M229.8 294 L229.8 319 L391.3 319 L391.3 398.5 L716.6 398.5 L716.6 494.5 L600.8 494.5 L600.8 551" style="stroke-width:3;animation-duration:1.8s"/>
<text class="edge-label" x="760.1" y="441.5">OrderPlaced</text>
