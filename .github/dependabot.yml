# Minor and patch updates arrive as one grouped pull request a week; each major update is its own pull request,
# so a breaking upgrade (TypeScript, Vitest, ELK) can be taken on its own terms.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
