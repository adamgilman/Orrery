# Minor and patch updates arrive as one grouped pull request a week; each major update is its own pull request,
# so a breaking upgrade (Vitest, jsdom) can be taken on its own terms. Two are held back on purpose:
# - elkjs: 0.12 crashes on compound graphs whenever model order is enforced (R6), which 0.9 handles. Revisit when
#   a release fixes it (packages/layout-elk/src/index.ts).
# - typescript majors: typescript-eslint supports TypeScript 7 only from 7.1; lift the ignore when it does.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: elkjs
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
