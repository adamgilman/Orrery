# Publishes every package to npm when a v* tag is pushed, after the full check, with provenance. Auth is an
# NPM_TOKEN repository secret when one is set (a granular token with publish rights on the orrery-diagrams org),
# otherwise npm's trusted publishing (each package on npmjs.com naming this repository and this workflow).
# The tag must equal the version in the package.json files: bump with
#   yarn workspaces foreach -A version <x.y.z>
# then commit, `git tag v<x.y.z>` and push the tag.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: npm install -g npm@latest
      - run: yarn install --immutable
      - run: yarn check
      - name: Tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "$f is $v, tag is $tag"; exit 1; }
          done
      - name: Pack and publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          mkdir -p /tmp/tarballs
          for w in core layout-elk runtime raster cli; do
            (cd packages/$w && yarn pack -o /tmp/tarballs/$w.tgz)
          done
          # idempotent: a rerun after a partial failure skips what is already on the registry
          for w in core layout-elk runtime raster cli; do
            name=$(node -p "require('./packages/$w/package.json').name")
            version=$(node -p "require('./packages/$w/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already published"; continue; fi
            npm publish /tmp/tarballs/$w.tgz --access public --provenance
          done
