# Every pull request and every push to main: typecheck, lint, and the full test suite. Branch protection on main
# requires the "lint" and "test" jobs to pass before a pull request can merge.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test
      # The ratchet measures whenever there is a build, whatever the tests said, so a pull request always gets its table.
      # A pull request may declare growth it means: a line `perf-accept: metric, metric` in its body, with the reason.
      # The `perf-ignore` label accepts every metric: the table is still measured and posted, but nothing blocks, and
      # the ratchet resets the baseline to what was measured when the pull request merges. Dependabot's carry it.
      # A push to main is judged by what the pull request it merged accepted, so the ratchet can run and reset.
      - name: Accepted growth, if the pull request declares any
        id: accept
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.pull_request.body }}
          IGNORE: ${{ contains(github.event.pull_request.labels.*.name, 'perf-ignore') }}
        run: |
          if [ "$EVENT" = "push" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty' 2>/dev/null || true)
            BODY=$(jq -r '.body // ""' <<<"${pr:-null}"); IGNORE=$(jq -r '[.labels[]?.name] | index("perf-ignore") != null' <<<"${pr:-null}")
          fi
          if [ "$IGNORE" = "true" ]; then echo "metrics=*" >> "$GITHUB_OUTPUT"
          else echo "metrics=$(printf '%s' "$BODY" | grep -oiE 'perf-accept:.*' | head -1 | sed 's/^[^:]*://')" >> "$GITHUB_OUTPUT"; fi
      - run: yarn perf
        if: always()
        env:
          ORRERY_SKIP_BUILD: "1"
          ORRERY_PERF_ACCEPT: ${{ steps.accept.outputs.metrics }}
      - name: Performance table
        if: always()
        run: cat test/perf/last.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Comment the performance table on the pull request
        # One comment per pull request, updated on every push. A metric marked SLOWER has already failed the job above.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          table=$(cat test/perf/last.md 2>/dev/null || echo "_Not measured: the build or the benchmark itself failed; see the test job._")
          body="$(printf '<!-- perf-ratchet -->\n## Performance ratchet\n\n%s\n_Measured on this runner against `test/perf/baseline.json`, which CI tightens on every push to main. Bytes and counts must not grow; timings may not exceed the baseline by more than 1.6× plus 2 ms. A metric marked SLOWER blocks the merge._\n' "$table")"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- perf-ratchet -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null; fi
  ratchet:
    # Every push to main measures again and tightens test/perf/baseline.json to the best numbers ever seen, then
    # commits it back with a deploy key the ruleset lets through. Nobody edits it; git history is the record.
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'ratchet:')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - name: Accepted growth, from the pull request this push merged
        id: accept
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty' 2>/dev/null || true)
          if [ "$(jq -r '[.labels[]?.name] | index("perf-ignore") != null' <<<"${pr:-null}")" = "true" ]; then echo "metrics=*" >> "$GITHUB_OUTPUT"
          else echo "metrics=$(jq -r '.body // ""' <<<"${pr:-null}" | grep -oiE 'perf-accept:.*' | head -1 | sed 's/^[^:]*://')" >> "$GITHUB_OUTPUT"; fi
      - run: yarn perf
        env:
          ORRERY_SKIP_BUILD: "1"
          ORRERY_PERF_MODE: ratchet
          ORRERY_PERF_ACCEPT: ${{ steps.accept.outputs.metrics }}
      - name: Commit the tightened baseline
        env:
          KEY: ${{ secrets.PERF_RATCHET_KEY }}
        run: |
          set -e
          { echo "## Performance ratchet"; cat test/perf/last.md; } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- test/perf/baseline.json; then echo "baseline unchanged"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ratchet && chmod 600 ~/.ssh/ratchet
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/ratchet -o IdentitiesOnly=yes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git add test/perf/baseline.json
          git commit -q -m "ratchet: baseline tightened after ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git push -q origin HEAD:main && break || { git pull -q --rebase origin main; }; done
